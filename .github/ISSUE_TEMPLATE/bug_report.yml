name: Bug report
description: Something in Orchard is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security issues, follow [SECURITY.md](https://github.com/hackclub/orchard/blob/main/SECURITY.md) instead of opening an issue.
  - type: input
    id: version
    attributes:
      label: Orchard version
      description: The server image tag, or the chart version for a Helm install.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Installer
        - Helm
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: The installer's `--mode`. Pick Not applicable for a Helm install.
      options:
        - public
        - tunnel
        - lan
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include logs if you have them, with secrets removed.
    validations:
      required: true
