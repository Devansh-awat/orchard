name: Feature request
description: Suggest something Orchard should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem you hit, in your own terms.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: How you would want it to work, and anything you tried instead.
    validations:
      required: true
