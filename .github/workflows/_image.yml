name: build-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      version:
        required: true
        type: string
      latest:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUSH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ inputs.version }}
            REQUIRE_SIGNED=${{ inputs.service == 'server' }}
            BUILDKIT_INLINE_CACHE=1
          secrets: ${{ inputs.service == 'server' && secrets.HOSTCTL_SIGNING_KEY != '' && format('hostctl_signing_key={0}', secrets.HOSTCTL_SIGNING_KEY) || '' }}
          outputs: type=image,name=ghcr.io/hackclub/orchard/${{ inputs.service }},push-by-digest=true,name-canonical=true,push=true
          no-cache-filters: ${{ inputs.service == 'server' && 'hostctl' || '' }}
          cache-from: type=gha,scope=release-${{ inputs.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ inputs.service }}-${{ matrix.arch }}
      - run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ inputs.service }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-${{ inputs.service }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUSH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        id: index
        env:
          IMAGE: ghcr.io/hackclub/orchard/${{ inputs.service }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "$IMAGE:$VERSION" -t "$IMAGE:sha-$SHA")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hackclub/orchard/${{ inputs.service }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/hackclub/orchard/${{ inputs.service }}@${{ steps.index.outputs.digest }}
          format: spdx-json
          output-file: /tmp/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/hackclub/orchard/${{ inputs.service }}
          subject-digest: ${{ steps.index.outputs.digest }}
          sbom-path: /tmp/sbom.spdx.json
          push-to-registry: true
