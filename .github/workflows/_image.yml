name: build-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ inputs.version }}
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ghcr.io/leafdtk/leaf/${{ inputs.service }}:${{ inputs.version }}
            ghcr.io/leafdtk/leaf/${{ inputs.service }}:latest
            ghcr.io/leafdtk/leaf/${{ inputs.service }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/leafdtk/leaf/${{ inputs.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/leafdtk/leaf/${{ inputs.service }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
