name: build-image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ inputs.version }}
            BUILDKIT_INLINE_CACHE=1
          tags: |
            ghcr.io/hackclub/orchard/${{ inputs.service }}:${{ inputs.version }}
            ghcr.io/hackclub/orchard/${{ inputs.service }}:latest
            ghcr.io/hackclub/orchard/${{ inputs.service }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/hackclub/orchard/${{ inputs.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/hackclub/orchard/${{ inputs.service }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd
