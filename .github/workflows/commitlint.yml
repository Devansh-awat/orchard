name: commitlint

# Conventional commits drive every version bump, so enforce them on PRs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint PR commits
        run: |
          npx --yes \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint --from "${{ github.event.pull_request.base.sha }}" \
                       --to "${{ github.event.pull_request.head.sha }}" \
                       --verbose
