name: clone-e2e

on:
  workflow_dispatch:
  push:
    paths:
      - apps/server/src/docker/clone-script.ts
      - apps/server/src/docker/repo-url.ts
      - apps/server/src/git/clone-credential.ts
      - apps/server/scripts/clone-e2e.ts
      - .github/workflows/clone-e2e.yml
  pull_request:
    paths:
      - apps/server/src/docker/clone-script.ts
      - apps/server/src/docker/repo-url.ts
      - apps/server/src/git/clone-credential.ts
      - apps/server/scripts/clone-e2e.ts
      - .github/workflows/clone-e2e.yml
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: clone-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  private-clone:
    name: the builder clones a private repo with every GitHub token kind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter server...

      - name: Start a private git host that answers as github.com
        run: |
          root="$RUNNER_TEMP/git"
          mkdir -p "$root/e2e" "$RUNNER_TEMP/src"
          git -C "$RUNNER_TEMP/src" init -q -b main
          echo private > "$RUNNER_TEMP/src/README"
          git -C "$RUNNER_TEMP/src" -c user.name=e2e -c user.email=e2e@example.com add README
          git -C "$RUNNER_TEMP/src" -c user.name=e2e -c user.email=e2e@example.com commit -qm init
          git clone -q --bare "$RUNNER_TEMP/src" "$root/e2e/private"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=github.com \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null
          cd apps/server
          sudo "$(command -v node)" --import tsx scripts/clone-e2e.ts serve \
            "$root" e2eSecretToken0123456789 "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/key.pem" 443 \
            > "$RUNNER_TEMP/host.log" 2>&1 &
          for _ in $(seq 30); do grep -q listening "$RUNNER_TEMP/host.log" && break; sleep 1; done
          cat "$RUNNER_TEMP/host.log"

      - name: Clone with the real clone step in the builder image
        run: |
          cd apps/server
          script=$(pnpm exec tsx scripts/clone-e2e.ts script main)
          clone() {
            docker run --rm --add-host github.com:host-gateway \
              -e GIT_SSL_NO_VERIFY=1 -e CLONE_URL="$1" \
              --entrypoint /bin/sh alpine/git:latest -c "$script" > "$RUNNER_TEMP/clone.log" 2>&1
          }
          docker run --rm --entrypoint sh alpine/git:latest -c 'git --version; apk info -v 2>/dev/null | grep -E "^(libcurl|curl)-" || true'
          failed=0
          for kind in ghs ghu gho ghp github_pat; do
            token="${kind}_e2eSecretToken0123456789"
            url=$(pnpm exec tsx scripts/clone-e2e.ts url https://github.com/e2e/private "$token")
            if clone "$url" && grep -q "Repository cloned successfully" "$RUNNER_TEMP/clone.log"; then
              echo "ok: $kind token clones"
            else
              echo "FAIL: $kind token does not clone"; cat "$RUNNER_TEMP/clone.log"; failed=1
            fi
            if grep -q "$token" "$RUNNER_TEMP/clone.log"; then
              echo "FAIL: $kind token leaked into the clone output"; failed=1
            fi
          done
          if clone "https://x-access-token:wrong@github.com/e2e/private"; then
            echo "FAIL: a wrong token cloned, so the host is not checking credentials"; failed=1
          else
            grep -q "GitHub authentication failed" "$RUNNER_TEMP/clone.log" && echo "ok: a wrong token is refused"
          fi
          if clone "https://ghu_e2eSecretToken0123456789@github.com/e2e/private"; then
            echo "note: the old username-only form also clones with this git"
          else
            echo "note: the old username-only form fails with this git, as in #242"
            sed 's/ghu_[A-Za-z0-9]*/***/g' "$RUNNER_TEMP/clone.log" | tail -8
          fi
          exit "$failed"

      - name: Host log
        if: always()
        run: cat "$RUNNER_TEMP/host.log" || true
