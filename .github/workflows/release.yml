name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  # release-please maintains the release PR and, when it merges, cuts the
  # GitHub releases/tags. Its per-package outputs decide what gets built.
  # Repository-gated so forks never attempt releases, image pushes, or
  # notifications that need org secrets.
  release-please:
    if: github.repository == 'hackclub/orchard'
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.rp1.outputs.releases_created || steps.rp2.outputs.releases_created || steps.rp3.outputs.releases_created }}
      platform: ${{ steps.rp1.outputs['apps/frontend--release_created'] || steps.rp2.outputs['apps/frontend--release_created'] || steps.rp3.outputs['apps/frontend--release_created'] || steps.rp1.outputs['apps/server--release_created'] || steps.rp2.outputs['apps/server--release_created'] || steps.rp3.outputs['apps/server--release_created'] || steps.rp1.outputs['apps/gateway--release_created'] || steps.rp2.outputs['apps/gateway--release_created'] || steps.rp3.outputs['apps/gateway--release_created'] || steps.rp1.outputs['apps/cli--release_created'] || steps.rp2.outputs['apps/cli--release_created'] || steps.rp3.outputs['apps/cli--release_created'] || steps.rp1.outputs['apps/r2-proxy--release_created'] || steps.rp2.outputs['apps/r2-proxy--release_created'] || steps.rp3.outputs['apps/r2-proxy--release_created'] || steps.rp1.outputs['apps/registry--release_created'] || steps.rp2.outputs['apps/registry--release_created'] || steps.rp3.outputs['apps/registry--release_created'] || steps.rp1.outputs['apps/fc-builder--release_created'] || steps.rp2.outputs['apps/fc-builder--release_created'] || steps.rp3.outputs['apps/fc-builder--release_created'] }}
      frontend: ${{ steps.rp1.outputs['apps/frontend--release_created'] || steps.rp2.outputs['apps/frontend--release_created'] || steps.rp3.outputs['apps/frontend--release_created'] }}
      frontend_v: ${{ steps.rp1.outputs['apps/frontend--version'] || steps.rp2.outputs['apps/frontend--version'] || steps.rp3.outputs['apps/frontend--version'] }}
      server: ${{ steps.rp1.outputs['apps/server--release_created'] || steps.rp2.outputs['apps/server--release_created'] || steps.rp3.outputs['apps/server--release_created'] }}
      server_v: ${{ steps.rp1.outputs['apps/server--version'] || steps.rp2.outputs['apps/server--version'] || steps.rp3.outputs['apps/server--version'] }}
      r2_proxy: ${{ steps.rp1.outputs['apps/r2-proxy--release_created'] || steps.rp2.outputs['apps/r2-proxy--release_created'] || steps.rp3.outputs['apps/r2-proxy--release_created'] }}
      r2_proxy_v: ${{ steps.rp1.outputs['apps/r2-proxy--version'] || steps.rp2.outputs['apps/r2-proxy--version'] || steps.rp3.outputs['apps/r2-proxy--version'] }}
      fc_builder: ${{ steps.rp1.outputs['apps/fc-builder--release_created'] || steps.rp2.outputs['apps/fc-builder--release_created'] || steps.rp3.outputs['apps/fc-builder--release_created'] }}
      fc_builder_v: ${{ steps.rp1.outputs['apps/fc-builder--version'] || steps.rp2.outputs['apps/fc-builder--version'] || steps.rp3.outputs['apps/fc-builder--version'] }}
      registry: ${{ steps.rp1.outputs['apps/registry--release_created'] || steps.rp2.outputs['apps/registry--release_created'] || steps.rp3.outputs['apps/registry--release_created'] }}
      registry_v: ${{ steps.rp1.outputs['apps/registry--version'] || steps.rp2.outputs['apps/registry--version'] || steps.rp3.outputs['apps/registry--version'] }}
      gateway: ${{ steps.rp1.outputs['apps/gateway--release_created'] || steps.rp2.outputs['apps/gateway--release_created'] || steps.rp3.outputs['apps/gateway--release_created'] }}
      gateway_v: ${{ steps.rp1.outputs['apps/gateway--version'] || steps.rp2.outputs['apps/gateway--version'] || steps.rp3.outputs['apps/gateway--version'] }}
      cli: ${{ steps.rp1.outputs['apps/cli--release_created'] || steps.rp2.outputs['apps/cli--release_created'] || steps.rp3.outputs['apps/cli--release_created'] }}
      cli_v: ${{ steps.rp1.outputs['apps/cli--version'] || steps.rp2.outputs['apps/cli--version'] || steps.rp3.outputs['apps/cli--version'] }}
      sandbox: ${{ steps.rp1.outputs['infra/images/sandbox--release_created'] || steps.rp2.outputs['infra/images/sandbox--release_created'] || steps.rp3.outputs['infra/images/sandbox--release_created'] }}
      sandbox_v: ${{ steps.rp1.outputs['infra/images/sandbox--version'] || steps.rp2.outputs['infra/images/sandbox--version'] || steps.rp3.outputs['infra/images/sandbox--version'] }}
      ui: ${{ steps.rp1.outputs['releases/ui--release_created'] || steps.rp2.outputs['releases/ui--release_created'] || steps.rp3.outputs['releases/ui--release_created'] }}
      ui_v: ${{ steps.rp1.outputs['releases/ui--version'] || steps.rp2.outputs['releases/ui--version'] || steps.rp3.outputs['releases/ui--version'] }}
      paths_released: ${{ steps.rp1.outputs.paths_released || steps.rp2.outputs.paths_released || steps.rp3.outputs.paths_released }}
      graft_sdk: ${{ steps.rp1.outputs['packages/graft-sdk--release_created'] || steps.rp2.outputs['packages/graft-sdk--release_created'] || steps.rp3.outputs['packages/graft-sdk--release_created'] }}
      graft_ui: ${{ steps.rp1.outputs['packages/graft-ui--release_created'] || steps.rp2.outputs['packages/graft-ui--release_created'] || steps.rp3.outputs['packages/graft-ui--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: 1090304
          private-key: ${{ secrets.LEAFDBOT_PRIVATE_KEY }}
      # release-please's merge-commit walk intermittently trips GitHub's GraphQL,
      # which answers "Something went wrong while executing your query" at a
      # random point (first page, or eighty commits deep). It is a known
      # upstream flake and a plain re-run clears it, so the job retries rather
      # than waiting for a human to press the button. The last attempt is not
      # continue-on-error, so a genuine failure still fails the job.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp1
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}

      - if: steps.rp1.outcome == 'failure'
        run: sleep 20
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp2
        if: steps.rp1.outcome == 'failure'
        continue-on-error: true
        with:
          token: ${{ steps.app-token.outputs.token }}

      - if: steps.rp1.outcome == 'failure' && steps.rp2.outcome == 'failure'
        run: sleep 45
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: rp3
        if: steps.rp1.outcome == 'failure' && steps.rp2.outcome == 'failure'
        with:
          token: ${{ steps.app-token.outputs.token }}

  image-frontend:
    needs: release-please
    if: needs.release-please.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: frontend
      dockerfile: apps/frontend/Dockerfile
      version: ${{ needs.release-please.outputs.frontend_v }}

  image-server:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: server
      dockerfile: apps/server/Dockerfile
      version: ${{ needs.release-please.outputs.server_v }}

  image-mcp:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: mcp
      dockerfile: apps/server/Dockerfile.mcp
      version: ${{ needs.release-please.outputs.server_v }}

  image-r2-proxy:
    needs: release-please
    if: needs.release-please.outputs.r2_proxy == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: r2-proxy
      dockerfile: apps/r2-proxy/Dockerfile
      context: apps/r2-proxy
      version: ${{ needs.release-please.outputs.r2_proxy_v }}

  image-fc-builder:
    needs: release-please
    if: needs.release-please.outputs.fc_builder == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: fc-builder
      dockerfile: apps/fc-builder/Dockerfile
      context: apps/fc-builder
      version: ${{ needs.release-please.outputs.fc_builder_v }}

  image-registry:
    needs: release-please
    if: needs.release-please.outputs.registry == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: registry
      dockerfile: apps/registry/Dockerfile
      context: apps/registry
      version: ${{ needs.release-please.outputs.registry_v }}

  # The machine image bakes in the orchard CLI (it runs the in-machine daemon),
  # so it rebuilds when either the sandbox package or the cli releases. A cli-only
  # rebuild is tagged <sandbox version>-cli.<cli version> so tags never collide.
  sandbox-version:
    needs: release-please
    if: needs.release-please.outputs.sandbox == 'true' || needs.release-please.outputs.cli == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        env:
          SANDBOX_RELEASED: ${{ needs.release-please.outputs.sandbox }}
          SANDBOX_V: ${{ needs.release-please.outputs.sandbox_v }}
          CLI_V: ${{ needs.release-please.outputs.cli_v }}
        run: |
          if [ "$SANDBOX_RELEASED" = "true" ]; then
            echo "version=$SANDBOX_V" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r '."infra/images/sandbox"' .release-please-manifest.json)-cli.$CLI_V" >> "$GITHUB_OUTPUT"
          fi

  image-sandbox:
    needs: sandbox-version
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      service: sandbox
      dockerfile: infra/images/sandbox/Dockerfile
      version: ${{ needs.sandbox-version.outputs.version }}

  # Builds cli binaries with goreleaser and attaches them to the release that
  # release-please just cut for tag cli/vX.Y.Z. OSS goreleaser cannot parse
  # monorepo component tags (monorepo.tag_prefix is a Pro feature), so we lay
  # a local plain vX.Y.Z tag for version templating and upload dist/ with gh;
  # goreleaser's own publisher is disabled in apps/cli/.goreleaser.yaml.
  cli-binaries:
    needs: release-please
    if: needs.release-please.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CLI_TAG: cli/v${{ needs.release-please.outputs.cli_v }}
      CLI_VERSION: ${{ needs.release-please.outputs.cli_v }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: cli/v${{ needs.release-please.outputs.cli_v }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum
      - name: Lay local semver tag for goreleaser
        run: git tag -f "v${CLI_VERSION}"
      # The default GITHUB_TOKEN only covers this repo; mint a leafdbot token
      # for the public releases repo + tap (the app must be installed on both).
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: publish-token
        with:
          app-id: 1090304
          private-key: ${{ secrets.LEAFDBOT_PRIVATE_KEY }}
          owner: LeafdTK
          repositories: |
            homebrew-tap
            orchard-releases
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: "~> v2"
          workdir: apps/cli
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: v${{ needs.release-please.outputs.cli_v }}
          GITHUB_TOKEN: ${{ steps.publish-token.outputs.token }}
          HOMEBREW_TAP_TOKEN: ${{ steps.publish-token.outputs.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: |
            apps/cli/dist/*.tar.gz
            apps/cli/dist/*.zip
      - run: cp "${{ steps.attest.outputs.bundle-path }}" apps/cli/dist/attestation.sigstore.jsonl
      - name: Upload binaries to the cli release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$CLI_TAG" \
            apps/cli/dist/*.tar.gz \
            apps/cli/dist/*.zip \
            apps/cli/dist/checksums.txt \
            apps/cli/dist/attestation.sigstore.jsonl \
            --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish the attestation next to the public binaries
        env:
          GH_TOKEN: ${{ steps.publish-token.outputs.token }}
        run: |
          gh release upload "v${CLI_VERSION}" apps/cli/dist/attestation.sigstore.jsonl \
            --clobber --repo LeafdTK/orchard-releases

  templates:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, '"registry"') || needs.release-please.outputs.server == 'true'
    uses: ./.github/workflows/registry.yml
    secrets: inherit

  updates:
    needs: release-please
    if: needs.release-please.outputs.ui == 'true'
    runs-on: ubuntu-latest
    environment: registry
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
      VERSION: ${{ needs.release-please.outputs.ui_v }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ui/v${{ needs.release-please.outputs.ui_v }}
      - name: Publish the note to assets.orchard.my
        run: |
          note="releases/ui/notes/$VERSION.md"
          test -f "$note" || { echo "::error::$note is missing, so there is nothing to show"; exit 1; }
          aws s3 cp "$note" "s3://$R2_BUCKET/updates/ui/$VERSION.md" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type 'text/markdown; charset=utf-8' \
            --cache-control 'public, max-age=300' \
            --only-show-errors
          jq -n --arg v "$VERSION" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/ui/v$VERSION" \
            '{version: $v, file: ($v + ".md"), publishedAt: $at, url: $url}' > "$RUNNER_TEMP/latest.json"
          aws s3 cp "$RUNNER_TEMP/latest.json" "s3://$R2_BUCKET/updates/ui/latest.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/json \
            --cache-control no-cache \
            --only-show-errors
      - name: Check what instances get
        run: |
          curl -fsSL "https://assets.orchard.my/updates/ui/latest.json?v=$GITHUB_SHA" | jq -e --arg v "$VERSION" '.version == $v'

  installer:
    needs: release-please
    if: needs.release-please.outputs.platform == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/installer.yml
    secrets: inherit

  grafts:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, 'grafts/')
    runs-on: ubuntu-latest
    environment: registry
    concurrency:
      group: graft-registry
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
      R2_ACCESS_KEY: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      REGISTRY_PREFIX: registry
      GRAFT_SIGNING_KEY: ${{ secrets.GRAFT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/registry/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Pack, sign and publish new versions
        id: publish
        run: |
          if [ -z "$GRAFT_SIGNING_KEY" ]; then
            echo "::warning::GRAFT_SIGNING_KEY is not set in the registry environment, so nothing was published. Grafts are never published unsigned."
            exit 0
          fi
          scripts/grafts-pack.sh "$RUNNER_TEMP/grafts" https://assets.orchard.my/registry
          go build -C apps/registry -o "$RUNNER_TEMP/registry" .
          "$RUNNER_TEMP/registry" publish-grafts \
            -grafts "$RUNNER_TEMP/grafts" \
            -public https://assets.orchard.my/registry \
            -revoked registry/grafts-revoked.txt
          if ls "$RUNNER_TEMP"/grafts/*.graft >/dev/null 2>&1; then echo "packed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.publish.outputs.packed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/grafts/*.graft
      # kubeops follows each graft's $graftpolicy with `graft bump`; this tells
      # it a new version exists instead of making it poll the marketplace.
      - if: steps.publish.outputs.packed == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: kubeops-token
        with:
          app-id: 1090304
          private-key: ${{ secrets.LEAFDBOT_PRIVATE_KEY }}
          owner: hackclub
          repositories: kubeops
      - if: steps.publish.outputs.packed == 'true'
        env:
          GH_TOKEN: ${{ steps.kubeops-token.outputs.token }}
        run: gh api repos/hackclub/kubeops/dispatches -f event_type=graft-published

  # Publishes the graft SDK and UI kit to npm when release-please cuts them, so
  # graft authors outside this repo can install them. npm trusted publishing
  # (OIDC) authenticates this exact workflow file, so the step must stay in
  # release.yml and the job must not move into a reusable workflow. Provenance
  # is automatic. A version already on npm is left alone, so re-runs are safe.
  npm-publish:
    needs: release-please
    if: github.event_name == 'workflow_dispatch' || needs.release-please.outputs.graft_sdk == 'true' || needs.release-please.outputs.graft_ui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g npm@latest
      - name: Publish @orchardlabs/graft-sdk and @orchardlabs/graft-ui
        env:
          SDK_RELEASED: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.graft_sdk == 'true' }}
          UI_RELEASED: ${{ github.event_name == 'workflow_dispatch' || needs.release-please.outputs.graft_ui == 'true' }}
        run: |
          set -euo pipefail
          publish() {
            local dir="$1" released="$2" name version
            [ "$released" = "true" ] || return 0
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              return 0
            fi
            (cd "$dir" && npm publish --access public)
            echo "published $name@$version"
          }
          publish packages/graft-sdk "$SDK_RELEASED"
          publish packages/graft-ui "$UI_RELEASED"

  # Runs after the (possibly-skipped) image jobs as long as none FAILED.
  publish-chart:
    needs: [release-please, image-frontend, image-server, image-mcp, image-r2-proxy, image-fc-builder]
    if: >-
      ${{ !cancelled() && needs.release-please.outputs.platform == 'true'
        && needs.image-frontend.result != 'failure'
        && needs.image-server.result != 'failure'
        && needs.image-mcp.result != 'failure'
        && needs.image-r2-proxy.result != 'failure'
        && needs.image-fc-builder.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Pin + publish chart
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          M=.release-please-manifest.json
          FRONTEND=$(jq -r '."apps/frontend"' "$M"); SERVER=$(jq -r '."apps/server"' "$M")
          R2=$(jq -r '."apps/r2-proxy"' "$M")
          FCB=$(jq -r '."apps/fc-builder"' "$M")
          UMBRELLA=$(printf '%s\n' \
            "$(jq -r '."apps/frontend"' "$M")" "$(jq -r '."apps/server"' "$M")" \
            "$(jq -r '."apps/gateway"' "$M")" "$(jq -r '."apps/cli"' "$M")" \
            "$(jq -r '."apps/r2-proxy"' "$M")" | sort -V | tail -1)

          yq -i ".version = \"$UMBRELLA\" | .appVersion = \"$UMBRELLA\"" infra/charts/orchard/Chart.yaml
          yq -i ".frontend.image.tag = \"$FRONTEND\"" infra/charts/orchard/values.yaml
          yq -i ".server.image.tag   = \"$SERVER\""   infra/charts/orchard/values.yaml
          yq -i ".mcp.image.tag      = \"$SERVER\""   infra/charts/orchard/values.yaml
          yq -i ".r2Proxy.image.tag  = \"$R2\""       infra/charts/orchard/values.yaml
          [ "$FCB" != "0.0.0" ] && yq -i ".fcBuilder.image.tag = \"$FCB\"" infra/charts/orchard/values.yaml

          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm package infra/charts/orchard -d dist
          helm push "$(ls dist/*.tgz)" oci://ghcr.io/hackclub/orchard/charts

  deploy-marker:
    needs: [release-please, publish-chart]
    if: ${{ !cancelled() && needs.release-please.outputs.platform == 'true' && needs.publish-chart.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Datadog deploy markers
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DD_API_KEY:-}" ]; then
            echo "DD_API_KEY not set — skipping deploy markers."
            exit 0
          fi
          SITE="${DD_SITE:-datadoghq.com}"
          mark() {
            local svc="$1" v="$2"
            [ -n "$v" ] || return 0
            curl -fsS -X POST "https://api.${SITE}/api/v1/events" \
              -H "DD-API-KEY: ${DD_API_KEY}" -H "Content-Type: application/json" \
              -d "{\"title\":\"Deploy ${svc} v${v}\",\"text\":\"orchard ${svc} ${v} via github actions %%% sha: ${{ github.sha }} %%%\",\"alert_type\":\"info\",\"tags\":[\"service:${svc}\",\"version:${v}\",\"env:production\",\"source:github\",\"event_type:deploy\"]}"
            echo "marked ${svc} v${v}"
          }
          [ "${{ needs.release-please.outputs.frontend }}" = "true" ] && mark frontend "${{ needs.release-please.outputs.frontend_v }}"
          [ "${{ needs.release-please.outputs.server }}" = "true" ]   && mark server   "${{ needs.release-please.outputs.server_v }}"
          [ "${{ needs.release-please.outputs.server }}" = "true" ]   && mark mcp      "${{ needs.release-please.outputs.server_v }}"
          [ "${{ needs.release-please.outputs.r2_proxy }}" = "true" ] && mark r2-proxy "${{ needs.release-please.outputs.r2_proxy_v }}"
          [ "${{ needs.release-please.outputs.fc_builder }}" = "true" ] && mark fc-builder "${{ needs.release-please.outputs.fc_builder_v }}"
          [ "${{ needs.release-please.outputs.registry }}" = "true" ] && mark registry "${{ needs.release-please.outputs.registry_v }}"
          [ "${{ needs.release-please.outputs.gateway }}" = "true" ]  && mark gateway  "${{ needs.release-please.outputs.gateway_v }}"
          [ "${{ needs.release-please.outputs.cli }}" = "true" ]      && mark cli      "${{ needs.release-please.outputs.cli_v }}"
          true

  # Ping the Flux webhook so the cluster pulls the new chart immediately
  # instead of waiting for the OCIRepository poll interval.
  flux-notify:
    needs: [release-please, publish-chart]
    if: ${{ !cancelled() && needs.release-please.outputs.platform == 'true' && needs.publish-chart.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Flux reconcile
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FLUX_WEBHOOK_URL:-}" ]; then
            echo "FLUX_WEBHOOK_URL not set — skipping (Flux pulls on its poll interval)."
            exit 0
          fi
          curl -fsS -X POST "$FLUX_WEBHOOK_URL" -H "Content-Type: application/json" -d '{}'
          echo "pinged Flux — orchard chart reconciles now."
