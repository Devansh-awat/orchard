name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            dockerfile: frontend/Dockerfile
          - name: server
            dockerfile: server/Dockerfile
          - name: mcp
            dockerfile: server/Dockerfile.mcp
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        with:
          # Use latest BuildKit for best cache-export support.
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR refs must be lowercase. Compute once for both image + cache tag.
      - id: refs
        run: |
          base="${IMAGE_BASE,,}"
          echo "image=${REGISTRY}/${base}/${MATRIX_NAME}" >> "$GITHUB_OUTPUT"
          echo "cache=${REGISTRY}/${base}/${MATRIX_NAME}:buildcache" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          MATRIX_NAME: ${{ matrix.name }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.refs.outputs.image }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # BuildKit inline cache so pulled images themselves seed local cache.
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          # Aggressive multi-source cache: GHA (fast, per-branch, 10GB cap) +
          # a dedicated registry cache tag (cross-branch, persists indefinitely) +
          # the latest published image as a final fallback.
          cache-from: |
            type=gha,scope=${{ matrix.name }}
            type=gha,scope=${{ matrix.name }}-main
            type=registry,ref=${{ steps.refs.outputs.cache }}
            type=registry,ref=${{ steps.refs.outputs.image }}:latest
          # Write to both: GHA for warm CI hits, registry for cross-branch + long-term.
          # mode=max stores every intermediate layer; image-manifest+oci needed for GHCR.
          cache-to: |
            type=gha,mode=max,scope=${{ matrix.name }}${{ github.ref == 'refs/heads/main' && '-main' || '' }}
            type=registry,ref=${{ steps.refs.outputs.cache }},mode=max,image-manifest=true,oci-mediatypes=true,compression=zstd

  chart:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          helm package charts/orchard -d dist
          echo "CHART_TGZ=$(ls dist/*.tgz)" >> "$GITHUB_ENV"
          echo "IMAGE_BASE_LC=${IMAGE_BASE,,}" >> "$GITHUB_ENV"
        env:
          IMAGE_BASE: ${{ env.IMAGE_BASE }}

      - name: Push chart to GHCR
        run: helm push "$CHART_TGZ" oci://${{ env.REGISTRY }}/${{ env.IMAGE_BASE_LC }}/charts
