name: depot-runner-check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/depot-runner-check.yml

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        runner: [depot-ubuntu-24.04, depot-ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - run: uname -a && nproc && echo "has secret access: ${{ secrets.LEAFDBOT_PRIVATE_KEY != '' }}"
