name: registry

on:
  pull_request:
    paths:
      - 'registry/**'
      - 'apps/server/src/templates/built-in/**'
      - 'apps/registry/**'
      - '.github/workflows/registry.yml'
  schedule:
    - cron: '23 4 * * 1'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' || github.repository == 'hackclub/orchard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/registry/go.mod
      - name: Validate every template
        run: |
          go build -C apps/registry -o "$RUNNER_TEMP/registry" .
          "$RUNNER_TEMP/registry" validate \
            -templates apps/server/src/templates/built-in \
            -templates registry/templates

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.repository == 'hackclub/orchard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: registry
    env:
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
      R2_ACCESS_KEY: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      REGISTRY_PREFIX: registry
      GRAFT_SIGNING_KEY: ${{ secrets.GRAFT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/registry/go.mod
      - name: Publish to R2
        run: |
          go build -C apps/registry -o "$RUNNER_TEMP/registry" .
          "$RUNNER_TEMP/registry" publish \
            -templates apps/server/src/templates/built-in \
            -templates registry/templates \
            -files registry/files \
            -source https://github.com/hackclub/orchard/blob/main \
            -version "$(cat registry/version.txt)" \
            -git -authors registry/authors.txt -icons default
