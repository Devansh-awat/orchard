name: registry

on:
  pull_request:
    paths:
      - 'registry/**'
      - 'apps/server/src/templates/built-in/**'
      - 'apps/registry/**'
  push:
    branches: [main]
    paths:
      - 'registry/**'
      - 'apps/server/src/templates/built-in/**'
      - 'apps/registry/**'

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/registry/go.mod
      - name: Validate every template
        run: |
          go run ./apps/registry validate \
            -templates apps/server/src/templates/built-in \
            -templates registry/templates

  publish:
    needs: validate
    if: github.event_name == 'push' && github.repository == 'hackclub/orchard'
    runs-on: ubuntu-latest
    environment: registry
    env:
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
      R2_ACCESS_KEY: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/registry/go.mod
      - name: Publish to R2
        run: |
          go run ./apps/registry publish \
            -templates apps/server/src/templates/built-in \
            -templates registry/templates \
            -files registry/files \
            -source https://github.com/hackclub/orchard/blob/main \
            -version "$(cat registry/version.txt)" \
            -git -authors registry/authors.txt -icons default
