name: grafts

on:
  pull_request:
    paths:
      - 'grafts/**'
      - 'packages/graft-sdk/**'
      - 'packages/graft-ui/**'
      - 'apps/frontend/src/lib/components/ui/**'
      - 'apps/registry/**'
      - 'registry/grafts-revoked.txt'
      - '.github/workflows/grafts.yml'
  push:
    branches: [main]
    paths:
      - 'grafts/**'
      - 'packages/graft-sdk/**'
      - 'packages/graft-ui/**'
      - 'apps/frontend/src/lib/components/ui/**'
      - 'apps/registry/**'
      - 'registry/grafts-revoked.txt'
      - '.github/workflows/grafts.yml'

concurrency:
  group: grafts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/registry/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Pack and validate every graft
        run: scripts/grafts-pack.sh "$RUNNER_TEMP/grafts" && go build -C apps/registry -o "$RUNNER_TEMP/registry" . && "$RUNNER_TEMP/registry" validate-grafts -grafts "$RUNNER_TEMP/grafts"

  publish:
    needs: pack
    if: github.event_name == 'push' && github.repository == 'hackclub/orchard'
    runs-on: ubuntu-latest
    environment: registry
    env:
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
      R2_ACCESS_KEY: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      R2_SECRET_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      REGISTRY_PREFIX: registry
      GRAFT_SIGNING_KEY: ${{ secrets.GRAFT_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/registry/go.mod
      - run: pnpm install --frozen-lockfile
      - name: Pack, sign and publish new versions
        run: |
          if [ -z "$GRAFT_SIGNING_KEY" ]; then
            echo "GRAFT_SIGNING_KEY is not set in the registry environment; refusing to publish unsigned grafts"
            exit 1
          fi
          scripts/grafts-pack.sh "$RUNNER_TEMP/grafts" https://assets.orchard.my/registry
          go build -C apps/registry -o "$RUNNER_TEMP/registry" .
          "$RUNNER_TEMP/registry" publish-grafts \
            -grafts "$RUNNER_TEMP/grafts" \
            -public https://assets.orchard.my/registry \
            -revoked registry/grafts-revoked.txt
