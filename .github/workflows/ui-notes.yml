name: ui-notes

on:
  push:
    branches: [main]
    paths: [releases/ui/notes/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  republish:
    if: github.repository == 'hackclub/orchard'
    runs-on: ubuntu-latest
    environment: registry
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Re-upload edited notes that are already published
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            notes=$(ls releases/ui/notes/*.md)
          else
            notes=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- releases/ui/notes/)
          fi
          for note in $notes; do
            file=$(basename "$note")
            if ! curl -fsI "https://assets.orchard.my/updates/ui/$file" >/dev/null; then
              echo "$file is not published yet; the ui release publishes it"
              continue
            fi
            aws s3 cp "$note" "s3://$R2_BUCKET/updates/ui/$file" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type 'text/markdown; charset=utf-8' \
              --cache-control 'public, max-age=300' \
              --only-show-errors
            echo "republished $file"
          done
      - name: Withdraw deleted notes
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          current=$(curl -fsSL "https://assets.orchard.my/updates/ui/latest.json?v=$GITHUB_SHA" | jq -r '.file // empty' || true)
          for note in $(git diff --name-only --diff-filter=D "$BEFORE" HEAD -- releases/ui/notes/); do
            file=$(basename "$note")
            if [ "$file" = "$current" ]; then
              echo '{}' > "$RUNNER_TEMP/latest.json"
              aws s3 cp "$RUNNER_TEMP/latest.json" "s3://$R2_BUCKET/updates/ui/latest.json" \
                --endpoint-url "$R2_ENDPOINT" \
                --content-type application/json \
                --cache-control no-cache \
                --only-show-errors
              echo "$file was the current update; nothing is announced now"
            fi
            aws s3 rm "s3://$R2_BUCKET/updates/ui/$file" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "withdrew $file"
          done
