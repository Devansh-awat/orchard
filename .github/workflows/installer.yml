name: installer

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'hackclub/orchard' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: registry
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check the script parses
        run: bash -n install/install.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest
        with:
          subject-path: install/install.sh
      - name: Upload to assets.orchard.my
        run: |
          aws s3 cp "${{ steps.attest.outputs.bundle-path }}" "s3://$R2_BUCKET/install.sh.sigstore.jsonl" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/jsonl \
            --cache-control no-cache \
            --only-show-errors
          (cd install && sha256sum install.sh) > "$RUNNER_TEMP/install.sh.sha256"
          aws s3 cp install/install.sh "s3://$R2_BUCKET/install.sh" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/x-sh \
            --cache-control no-cache \
            --only-show-errors
          aws s3 cp "$RUNNER_TEMP/install.sh.sha256" "s3://$R2_BUCKET/install.sh.sha256" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain \
            --cache-control no-cache \
            --only-show-errors
      - name: Check what curl gets
        run: |
          want=$(sha256sum install/install.sh | cut -d' ' -f1)
          got=$(curl -fsSL "https://assets.orchard.my/install.sh?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
          test "$want" = "$got"
