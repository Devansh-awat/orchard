name: installer

on:
  push:
    branches: [main]
    paths:
      - 'install/install.sh'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'hackclub/orchard'
    runs-on: ubuntu-latest
    environment: registry
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.REGISTRY_R2_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.REGISTRY_R2_SECRET_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      R2_ENDPOINT: ${{ secrets.REGISTRY_R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.REGISTRY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the script parses
        run: bash -n install/install.sh
      - name: Upload to assets.orchard.my
        run: |
          aws s3 cp install/install.sh "s3://$R2_BUCKET/install.sh" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/x-sh \
            --cache-control no-cache \
            --only-show-errors
      - name: Check what curl gets
        run: |
          want=$(sha256sum install/install.sh | cut -d' ' -f1)
          got=$(curl -fsSL "https://assets.orchard.my/install.sh?v=$GITHUB_SHA" | sha256sum | cut -d' ' -f1)
          test "$want" = "$got"
