name: dependency-advisories

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - install/install.sh
      - infra/charts/orchard/values.yaml
      - apps/server/hostctl/cmd/advisorycheck/**
      - apps/server/hostctl/internal/commands/addons.go
      - apps/server/hostctl/internal/commands/images.go
      - apps/server/hostctl/internal/commands/shipped.go
      - apps/server/hostctl/internal/commands/thirdparty.go
      - .github/workflows/dependency-advisories.yml

permissions:
  contents: read

concurrency:
  group: dependency-advisories-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/server/hostctl/go.mod
          cache-dependency-path: apps/server/hostctl/go.sum
      - name: Check the shipped versions against OSV.dev
        id: check
        working-directory: apps/server/hostctl
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set +e
          go run ./cmd/advisorycheck -markdown "$RUNNER_TEMP/advisories.md"
          code=$?
          set -e
          if [ -f "$RUNNER_TEMP/advisories.md" ]; then
            cat "$RUNNER_TEMP/advisories.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$code" in
            0) echo "status=clean" >> "$GITHUB_OUTPUT" ;;
            1)
              echo "status=needs-you" >> "$GITHUB_OUTPUT"
              echo "::error title=Advisories in shipped components::A shipped component has a known advisory. Read the job summary."
              exit 1
              ;;
            3)
              echo "status=unreachable" >> "$GITHUB_OUTPUT"
              if [ "$EVENT" = pull_request ]; then
                echo "::warning title=Could not check advisories::OSV.dev, a registry or a chart repository did not answer. The scheduled run checks again."
                exit 0
              fi
              echo "::error title=Could not check advisories::OSV.dev, a registry or a chart repository did not answer."
              exit 1
              ;;
            *) exit "$code" ;;
          esac
      - name: Keep the report
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: advisories
          path: ${{ runner.temp }}/advisories.md
          if-no-files-found: ignore
          retention-days: 7

  issue:
    needs: check
    if: always() && github.event_name == 'schedule' && needs.check.outputs.status != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STATUS: ${{ needs.check.outputs.status }}
      TITLE: Advisories in shipped components
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: advisories
          path: report
      - name: Open, update or close the tracking issue
        run: |
          number=$(gh issue list --state open --author "app/github-actions" --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ "$STATUS" = clean ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Every shipped component is clear as of $RUN_URL."
            fi
            exit 0
          fi
          {
            cat report/advisories.md
            printf '\nLast checked by %s.\n' "$RUN_URL"
          } > body.md
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi
