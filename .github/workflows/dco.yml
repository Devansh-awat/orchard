name: dco

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  sign-off:
    if: ${{ !contains(fromJSON('["dependabot[bot]","leafdbot[bot]","release-please[bot]"]'), github.event.pull_request.user.login) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check commit sign-offs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          missing=$(gh api --paginate "repos/$REPO/pulls/$PR/commits?per_page=100" --jq '
            .[]
            | select((.parents | length) < 2)
            | (.author.login // "") as $login
            | select($login != "dependabot[bot]" and $login != "leafdbot[bot]" and $login != "release-please[bot]")
            | (.commit.author.email | ascii_downcase) as $email
            | select([.commit.message | ascii_downcase | split("\n")[] | sub("\\s+$"; "") | select(startswith("signed-off-by:") and endswith("<" + $email + ">"))] | length == 0)
            | .sha')
          if [ -n "$missing" ]; then
            echo "::error::These commits need a Signed-off-by line matching their author email. Run: git rebase --signoff origin/main"
            echo "$missing"
            exit 1
          fi
          echo "All commits are signed off."
