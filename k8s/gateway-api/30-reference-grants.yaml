---
# ReferenceGrants let routes in any namespace attach to the Gateways that live
# in the `network` namespace. Without these grants, HTTPRoute/TCPRoute
# `parentRefs` to cross-namespace Gateways are rejected.
#
# One grant per Gateway, installed in the Gateway's namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: http-gateway-from-all
  namespace: network
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: ""  # any namespace; Traefik honors empty-string wildcard
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: http-gateway
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: db-gateway-from-all
  namespace: network
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TCPRoute
      namespace: ""
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: db-gateway
