---
# Wildcard certificate for *.a.lfdl.ink (auto-generated app domains).
# Requires a cert-manager ClusterIssuer that supports DNS-01 for lfdl.ink.
# Replace `letsencrypt-dns01` below with the name of your DNS-01 ClusterIssuer.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-a-lfdl-ink
  namespace: network
spec:
  secretName: wildcard-a-lfdl-ink-tls
  issuerRef:
    name: letsencrypt-dns01
    kind: ClusterIssuer
  commonName: "*.a.lfdl.ink"
  dnsNames:
    - "*.a.lfdl.ink"
    - "a.lfdl.ink"
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h   # 90d
  renewBefore: 360h # 15d
