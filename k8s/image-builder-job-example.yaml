# Example BuildKit image builder job
# This is automatically created by the ImageBuilderService but shown here for reference

apiVersion: batch/v1
kind: Job
metadata:
  name: image-builder-example-abc123
  namespace: leaf-builders
  labels:
    app.kubernetes.io/name: image-builder
    app.kubernetes.io/managed-by: leaf
    leaf.dev/deployment-id: example-deployment-id
    leaf.dev/image-name: my-app
  annotations:
    leaf.dev/repo-url: https://github.com/example/repo
    leaf.dev/branch: main
    leaf.dev/full-image: harbor-core.harbor.svc.cluster.local/leaf/my-app:latest
spec:
  ttlSecondsAfterFinished: 3600  # Cleanup job after 1 hour
  backoffLimit: 0                 # Don't retry failed builds
  activeDeadlineSeconds: 1800     # 30 minute timeout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-builder
        leaf.dev/deployment-id: example-deployment-id
    spec:
      restartPolicy: Never
      serviceAccountName: image-builder
      containers:
        - name: buildkit
          image: moby/buildkit:latest
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -ex

              echo "=== Starting BuildKit Build ==="
              echo "Image: harbor-core.harbor.svc.cluster.local/leaf/my-app:latest"
              echo "Repository: https://github.com/example/repo"
              echo "Branch: main"
              echo "Dockerfile: Dockerfile"

              # Install git
              apk add --no-cache git

              # Clone repository
              mkdir -p /workspace
              cd /workspace
              git clone --depth 1 --branch "main" "https://github.com/example/repo" repo
              cd repo

              echo "Build context: $(pwd)"
              echo "Dockerfile: Dockerfile"

              # Start buildkitd
              buildkitd --addr unix:///run/buildkit/buildkitd.sock &
              sleep 5

              # Wait for buildkitd to be ready
              until buildctl --addr unix:///run/buildkit/buildkitd.sock debug workers; do
                echo "Waiting for buildkitd..."
                sleep 1
              done

              echo "=== BuildKit daemon ready ==="
              echo "=== Building image ==="

              # Build with S3 cache (if configured)
              buildctl --addr unix:///run/buildkit/buildkitd.sock build \
                --frontend dockerfile.v0 \
                --local context=. \
                --local dockerfile=. \
                --opt filename=Dockerfile \
                --opt platform=linux/amd64 \
                --cache-from=type=s3,endpoint_url=https://your-s3-endpoint,bucket=buildkit-cache,region=auto,prefix=buildkit-cache/ \
                --cache-to=type=s3,endpoint_url=https://your-s3-endpoint,bucket=buildkit-cache,region=auto,prefix=buildkit-cache/,mode=max \
                --output type=image,name=harbor-core.harbor.svc.cluster.local/leaf/my-app:latest,push=true

              echo "=== Build and push completed ==="
              echo "Image available at: harbor-core.harbor.svc.cluster.local/leaf/my-app:latest"
          env:
            - name: DOCKER_CONFIG
              value: /root/.docker
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: buildkit-s3-cache-creds
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: buildkit-s3-cache-creds
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
          volumeMounts:
            - name: docker-config
              mountPath: /root/.docker
              readOnly: true
            - name: buildkit-state
              mountPath: /var/lib/buildkit
            - name: buildkit-config
              mountPath: /etc/buildkit
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
      volumes:
        - name: docker-config
          secret:
            secretName: harbor-registry-creds
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: buildkit-state
          emptyDir: {}
        - name: buildkit-config
          configMap:
            name: buildkit-config
