image:
  repository: hackclub/orchard

datadog:
  enabled: false

signupMode: open

tenant:
  storageClass: local-path
  ingressClass: traefik
  certClusterIssuer: selfsigned

ingress:
  host: orchard.127.0.0.1.nip.io
  entryPoints: [web]
  tls:
    enabled: false

gateway:
  http:
    appDomain: apps.127.0.0.1.nip.io

postgres:
  storage:
    size: 2Gi
    storageClass: local-path

redis:
  storage: 512Mi
  storageClass: local-path

mcp:
  enabled: false

metrics:
  enabled: true
  victoriametrics:
    retention: 7d
    storage:
      size: 2Gi
      storageClass: local-path

logs:
  enabled: true
  retention: 7d
  maxDiskSpaceUsage: 2GiB
  victorialogs:
    storage:
      size: 3Gi
      storageClass: local-path

objectStorage:
  local:
    enabled: true
    storage:
      size: 5Gi
      storageClass: local-path

r2Proxy:
  replicas: 1

certificates:
  enabled: false

builders:
  enabled: false

server:
  replicas: 1
  env:
    - { name: JWT_SECRET, value: quickstart-insecure-jwt-secret }
    - { name: SECRETS_ENCRYPTION_KEY, value: quickstart-insecure-enc-key0000 }
    - { name: APP_DOMAIN, value: apps.127.0.0.1.nip.io }
    - { name: FRONTEND_URL, value: 'http://orchard.127.0.0.1.nip.io:8080' }

frontend:
  replicas: 1
  env:
    - { name: PUBLIC_OAUTH_PROVIDER, value: none }
