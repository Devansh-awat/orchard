createNamespace: false

image:
  repository: hackclub/orchard

datadog:
  enabled: false

signupMode: open

tenant:
  ingressNamespaces: 'traefik,orchard'
  storageClass: local-path
  ingressClass: traefik
  certClusterIssuer: selfsigned

ingress:
  host: orchard.127.0.0.1.nip.io
  entryPoints: [web]
  tls:
    enabled: false

gateway:
  http:
    enabled: false
    appDomain: apps.127.0.0.1.nip.io

postgres:
  storage:
    size: 2Gi
    storageClass: local-path

redis:
  storage: 512Mi
  storageClass: local-path

mcp:
  enabled: false

metrics:
  enabled: true
  victoriametrics:
    retention: 7d
    storage:
      size: 2Gi
      storageClass: local-path

logs:
  enabled: true
  retention: 7d
  maxDiskSpaceUsage: 2GiB
  victorialogs:
    storage:
      size: 3Gi
      storageClass: local-path

objectStorage:
  local:
    enabled: true
    storage:
      size: 5Gi
      storageClass: local-path

r2Proxy:
  replicas: 1

certificates:
  enabled: false

builders:
  enabled: false

server:
  replicas: 1
  image:
    tag: latest
  env:
    - name: JWT_SECRET
      valueFrom: { secretKeyRef: { name: orchard-quickstart-secrets, key: jwt } }
    - name: SECRETS_ENCRYPTION_KEY
      valueFrom: { secretKeyRef: { name: orchard-quickstart-secrets, key: enc } }
    - { name: APP_DOMAIN, value: apps.127.0.0.1.nip.io }
    - { name: FRONTEND_URL, value: 'http://orchard.127.0.0.1.nip.io:8080' }
    - { name: SESSION_COOKIE_SECURE, value: 'false' }
    - { name: PUBLIC_HTTP_PORT, value: '8080' }
    - { name: PUBLIC_HTTPS_PORT, value: '8443' }

frontend:
  replicas: 1
  image:
    tag: latest
  env:
    - { name: PUBLIC_OAUTH_PROVIDER, value: none }
    - { name: PUBLIC_HTTP_PORT, value: '8080' }
    - { name: PUBLIC_HTTPS_PORT, value: '8443' }
