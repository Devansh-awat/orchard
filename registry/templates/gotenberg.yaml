apiVersion: leaf/v1
kind: Template
metadata:
  name: gotenberg
  displayName: 'Gotenberg'
  description: 'An API that turns HTML, Markdown and Office documents into PDFs. Internal-only; call it from your apps.'
  icon: https://github.com/gotenberg.png?size=256
  version: '1.0.0'
  category: developer
  tags: ['pdf', 'api', 'conversion']
  keywords: ['html to pdf', 'libreoffice', 'chromium', 'document conversion']
  homepage: https://gotenberg.dev
  license: MIT

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'gotenberg'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: timeoutSeconds
    displayName: 'Conversion timeout (seconds)'
    type: number
    default: 30
    validation:
      min: 5

resources:
  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      image: gotenberg/gotenberg:8
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      env:
        - key: API_TIMEOUT
          value: '{{ params.timeoutSeconds }}s'
