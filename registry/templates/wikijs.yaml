apiVersion: leaf/v1
kind: Template
metadata:
  name: wikijs
  displayName: 'Wiki.js'
  description: 'A modern wiki with a WYSIWYG and markdown editor, and dozens of auth providers.'
  icon: https://github.com/requarks.png?size=256
  version: '1.1.0'
  category: docs
  tags: ['wiki', 'docs', 'knowledge base']
  keywords: ['confluence', 'documentation', 'mediawiki', 'handbook']
  homepage: https://js.wiki
  license: AGPL-3.0-only

parameters:
  - name: appName
    displayName: 'App Name'
    type: string
    default: 'wiki'
    required: true
    validation:
      pattern: '^[a-z][a-z0-9-]{1,58}[a-z0-9]$'
      message: 'Must be lowercase alphanumeric with hyphens, 3-60 chars'
  - name: domain
    displayName: 'Domain'
    type: string
    required: true
    placeholder: 'wiki.example.com'
  - name: enableTls
    displayName: 'Enable HTTPS'
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: '{{ params.appName }}-db'
      resources:
        cpu: 500m
        memory: 1Gi

  - name: app
    type: deployment
    config:
      name: '{{ params.appName }}'
      resources:
        cpu: 500m
        memory: 512Mi
      image: ghcr.io/requarks/wiki:2
      replicas: 1
      ports:
        - name: http
          containerPort: 3000
          servicePort: 3000
          protocol: TCP
      env:
        - key: DB_TYPE
          value: postgres
        - key: DB_HOST
          value: '{{ resources.db.host }}'
        - key: DB_PORT
          value: '{{ resources.db.port }}'
        - key: DB_USER
          value: '{{ resources.db.dbUser }}'
        - key: DB_PASS
          value: '{{ resources.db.dbPassword }}'
          secret: true
        - key: DB_NAME
          value: '{{ resources.db.dbName }}'

  - name: ingress
    type: ingress
    config:
      host: '{{ params.domain }}'
      tlsEnabled: '{{ params.enableTls }}'
      routes:
        - path: /
          serviceName: '{{ resources.app.serviceName }}'
          servicePort: 3000
