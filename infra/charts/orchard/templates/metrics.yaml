{{- if .Values.metrics.enabled }}
{{- $ns := .Values.metrics.namespace -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: orchard-metrics
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: {{ $ns }}
  labels:
    app: victoriametrics
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8428, targetPort: 8428, protocol: TCP }
  selector:
    app: victoriametrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoriametrics
  namespace: {{ $ns }}
  labels:
    app: victoriametrics
spec:
  serviceName: victoriametrics
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: victoriametrics
          image: {{ .Values.metrics.victoriametrics.image }}
          args:
            - "-storageDataPath=/data"
            - "-retentionPeriod={{ .Values.metrics.victoriametrics.retention }}"
            - "-httpListenAddr=:8428"
            - "-storage.minFreeDiskSpaceBytes=512MB"
            - "-search.maxConcurrentRequests=16"
            - "-search.maxQueryDuration=30s"
            - "-search.maxSeries=300000"
            - "-search.maxPointsPerTimeseries=30000"
            - "-search.latencyOffset=15s"
            - "-memory.allowedPercent=80"
            - "-loggerLevel=INFO"
          ports:
            - { name: http, containerPort: 8428 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "200m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.metrics.victoriametrics.storage.storageClass }}
        resources:
          requests:
            storage: {{ .Values.metrics.victoriametrics.storage.size }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vmagent
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-vmagent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-vmagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-vmagent
subjects:
  - kind: ServiceAccount
    name: vmagent
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - nodes
      - pods
      - services
      - serviceaccounts
      - resourcequotas
      - replicationcontrollers
      - limitranges
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - endpoints
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "daemonsets", "deployments", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingressclasses", "ingresses"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["certificates.k8s.io"]
    resources: ["certificatesigningrequests"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: {{ $ns }}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: {{ $ns }}
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  ports:
    - { name: http-metrics, port: 8080, targetPort: 8080 }
    - { name: telemetry,    port: 8081, targetPort: 8081 }
  selector:
    app: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: {{ $ns }}
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - "--port=8080"
            - "--telemetry-port=8081"
            - "--resources=daemonsets,deployments,jobs,pods,replicasets,statefulsets,nodes,namespaces,services,horizontalpodautoscalers,resourcequotas,persistentvolumeclaims,cronjobs,limitranges,replicationcontrollers,storageclasses,configmaps,endpoints,ingresses,networkpolicies"
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: telemetry,    containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /, port: http-metrics }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: telemetry }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: {{ $ns }}
  labels:
    app: node-exporter
spec:
  clusterIP: None
  ports:
    - { name: metrics, port: 9100, targetPort: 9100 }
  selector:
    app: node-exporter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: {{ $ns }}
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.8.2
          args:
            - "--web.listen-address=:9100"
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--path.rootfs=/host/root"
            - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|var/lib/(docker|kubelet)/.+)($|/)"
            - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$"
            - "--no-collector.wifi"
            - "--no-collector.hwmon"
          ports:
            - { name: metrics, containerPort: 9100 }
          volumeMounts:
            - { name: proc,   mountPath: /host/proc, readOnly: true }
            - { name: sys,    mountPath: /host/sys,  readOnly: true }
            - { name: rootfs, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer }
          resources:
            requests: { cpu: "50m",  memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: proc,   hostPath: { path: /proc } }
        - { name: sys,    hostPath: { path: /sys } }
        - { name: rootfs, hostPath: { path: / } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: {{ $ns }}
data:
  scrape.yaml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: leafycluster

    scrape_configs:
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: (.+):(.+)
            target_label: __address__
            replacement: $1:10250
          - target_label: __metrics_path__
            replacement: /metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'container_(cpu_usage_seconds_total|memory_working_set_bytes|memory_rss|memory_usage_bytes|network_receive_bytes_total|network_transmit_bytes_total|network_receive_packets_dropped_total|network_transmit_packets_dropped_total|fs_usage_bytes|fs_limit_bytes)'
            action: keep
          - source_labels: [__name__, container]
            regex: 'container_(cpu|memory|fs)_.*;POD'
            action: drop

      - job_name: kubernetes-kubelet
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__address__]
            regex: (.+):(.+)
            target_label: __address__
            replacement: $1:10250
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'kubelet_(running_pods|running_containers|pod_start_duration_seconds.*)'
            action: keep

      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [{{ $ns }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            regex: kube-state-metrics;http-metrics
            action: keep

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces: { names: [{{ $ns }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            regex: node-exporter;metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      - job_name: kubernetes-pods
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: 'true'
            action: keep
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # HAProxy ingress controller — per-backend HTTP metrics (request rate,
      # response codes, response time). These replace the retired Cilium/Hubble
      # L7 series the Orchard dashboard used before the HAProxy switchover.
      # Scraped off the controller's built-in Prometheus exporter on the stat
      # port (1024, enabled via controller.prometheus in the haproxy chart).
      # Datadog scrapes the same endpoint independently via its node agent; this
      # is the in-cluster VM copy the dashboard queries (no per-query billing).
      # Keep only the three backend series the dashboard reads to bound the
      # cardinality the per-server/process firehose would otherwise add.
      - job_name: haproxy-ingress
        params:
          scope: [backend]
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [network] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            regex: kubernetes-ingress
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: stat
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: 'haproxy_backend_(http_responses_total|response_time_average_seconds|max_response_time_seconds)'
            action: keep
---
apiVersion: v1
kind: Service
metadata:
  name: vmagent
  namespace: {{ $ns }}
  labels:
    app: vmagent
spec:
  type: ClusterIP
  ports:
    - { name: http, port: 8429, targetPort: 8429 }
  selector:
    app: vmagent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: {{ $ns }}
  labels:
    app: vmagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmagent
  template:
    metadata:
      labels:
        app: vmagent
    spec:
      serviceAccountName: vmagent
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.106.1
          args:
            - "-promscrape.config=/config/scrape.yaml"
            - "-promscrape.maxScrapeSize=64MB"
            # Hot-reload the scrape config when the ConfigMap changes, so adding
            # a scrape job doesn't require a manual vmagent restart.
            - "-promscrape.configCheckInterval=30s"
            - "-remoteWrite.url=http://victoriametrics.{{ $ns }}.svc.cluster.local:8428/api/v1/write"
            - "-remoteWrite.tmpDataPath=/tmp/vmagent"
            - "-remoteWrite.maxDiskUsagePerURL=512MB"
            - "-memory.allowedPercent=80"
            - "-httpListenAddr=:8429"
            - "-loggerLevel=INFO"
          ports:
            - { name: http, containerPort: 8429 }
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: tmp,    mountPath: /tmp/vmagent }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: config
          configMap: { name: vmagent-config }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
{{- end }}
