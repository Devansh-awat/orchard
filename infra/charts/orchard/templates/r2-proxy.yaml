{{- if include "orchard.r2ProxyActive" . }}
# r2-proxy: S3 V4 re-signing gateway sitting between CNPG/barman pods and
# the real R2 endpoint. Tenant clusters hold per-cluster "fake" credentials
# that only work via this proxy and only against their own prefix.
# The real R2 key lives in `r2-proxy-upstream` here and never leaves this ns.
#
# Bindings are read directly from orchard's Postgres `databases` table: no
# ConfigMap to drift out of sync with the source of truth.
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/managed-by: orchard
    orchard.io/component: r2-proxy
---
# Upstream R2 credentials: the only place the real R2 key exists in-cluster.
# Set via values, or replace with an externally-managed Secret (External Secrets,
# SOPS, Vault, etc.) and point the Deployment at it instead.
apiVersion: v1
kind: Secret
metadata:
  name: r2-proxy-upstream
  namespace: {{ .Values.r2Proxy.namespace }}
type: Opaque
stringData:
{{- if .Values.r2Proxy.upstream.endpoint }}
  {{- if not (or .Values.r2Proxy.defaultBucket .Values.r2Proxy.allowedBuckets) }}
  {{- fail "r2Proxy.upstream.endpoint needs r2Proxy.defaultBucket or r2Proxy.allowedBuckets: the proxy only signs requests with the platform credentials for buckets named there, and refuses to start with none" }}
  {{- end }}
  R2_ENDPOINT: {{ .Values.r2Proxy.upstream.endpoint | quote }}
  R2_REGION: {{ .Values.r2Proxy.upstream.region | quote }}
  {{- if eq (toString .Values.r2Proxy.upstream.pathStyle) "false" }}
  R2_PATH_STYLE: "false"
  {{- end }}
  R2_ACCESS_KEY: {{ .Values.r2Proxy.upstream.accessKey | quote }}
  R2_SECRET_KEY: {{ .Values.r2Proxy.upstream.secretKey | quote }}
  DEFAULT_BACKUP_BUCKET: {{ .Values.r2Proxy.defaultBucket | default "" | quote }}
  {{- if .Values.r2Proxy.allowedBuckets }}
  ALLOWED_BUCKETS: {{ join "," .Values.r2Proxy.allowedBuckets | quote }}
  {{- end }}
{{- else if .Values.objectStorage.local.enabled }}
  R2_ENDPOINT: {{ include "orchard.objectStorageEndpoint" . | quote }}
  R2_REGION: {{ .Values.objectStorage.local.region | quote }}
  R2_ACCESS_KEY: {{ include "orchard.objectStorageKey" (dict "root" . "field" "accessKey") | quote }}
  R2_SECRET_KEY: {{ include "orchard.objectStorageKey" (dict "root" . "field" "secretKey") | quote }}
  DEFAULT_BACKUP_BUCKET: {{ .Values.r2Proxy.defaultBucket | default .Values.objectStorage.local.bucket | quote }}
{{- else }}
  DEFAULT_BACKUP_BUCKET: {{ .Values.r2Proxy.defaultBucket | default "" | quote }}
{{- end }}
---
# Database URL for binding lookups. The proxy connects as the read-only
# orchard_r2_proxy role the postgres cluster manages; r2Proxy.databaseUrl
# overrides it for a cluster the chart does not run.
apiVersion: v1
kind: Secret
metadata:
  name: r2-proxy-db
  namespace: {{ .Values.r2Proxy.namespace }}
type: Opaque
stringData:
{{- if .Values.r2Proxy.databaseUrl }}
  DATABASE_URL: {{ .Values.r2Proxy.databaseUrl | quote }}
{{- else if .Values.postgres.enabled }}
  DATABASE_URL: {{ printf "postgresql://orchard_r2_proxy:%s@%s-r.%s.svc.cluster.local:5432/%s?sslmode=require" (include "orchard.r2ProxyDbPassword" . | urlquery) .Values.postgres.name .Values.namespace .Values.postgres.database | quote }}
{{- else }}
  DATABASE_URL: ""
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2-proxy
  namespace: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: orchard
spec:
  replicas: {{ .Values.r2Proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: r2-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/upstream: {{ dict "upstream" .Values.r2Proxy.upstream "defaultBucket" .Values.r2Proxy.defaultBucket "allowedBuckets" .Values.r2Proxy.allowedBuckets "objectStorage" .Values.objectStorage | toJson | sha256sum }}
      labels:
        app.kubernetes.io/name: r2-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: r2-proxy
          image: {{ include "orchard.image" (list . .Values.r2Proxy.image.name .Values.r2Proxy.image.tag .Values.r2Proxy.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          env:
            - { name: PROXY_LISTEN, value: ":9000" }
            {{- with include "orchard.buildCacheBucket" . }}
            - { name: BUILD_CACHE_BUCKET, value: {{ . | quote }} }
            {{- end }}
          envFrom:
            - secretRef:
                name: r2-proxy-upstream
            - secretRef:
                name: r2-proxy-db
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.r2Proxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: stored-upstreams, mountPath: /etc/r2-proxy/stored, readOnly: true }
      volumes:
        - name: stored-upstreams
          secret:
            secretName: r2-proxy-stored
            optional: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-r2-proxy-stored
  namespace: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/managed-by: orchard
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["r2-proxy-stored"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-r2-proxy-stored
  namespace: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/managed-by: orchard
subjects:
  - kind: ServiceAccount
    name: orchard-server
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-r2-proxy-stored
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: r2-proxy
  namespace: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9000
      targetPort: http
{{- if .Values.r2Proxy.networkPolicy.enabled }}
---
# Default-deny + tightly-scoped allow rules for the proxy namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: r2-proxy-ingress
  namespace: {{ .Values.r2Proxy.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: r2-proxy
  policyTypes: [Ingress]
  ingress:
    # Barman sidecars run in tenant namespaces, which carry the managed label.
    # The server, the CNPG operator and the build namespace (its S3 cache goes
    # through the proxy with a per-tenant key) are the other callers.
    # Sandboxes and image scans have no business here.
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: orchard.my/managed, operator: Exists }
        - namespaceSelector:
            matchExpressions:
              - { key: orchard.dev/managed, operator: Exists }
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.tenant.cnpgOperatorNamespace | default "postgresql" }}
        {{- if .Values.builders.enabled }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.builders.namespace }}
        {{- end }}
      ports:
        - port: 9000
          protocol: TCP
{{- end }}
{{- end }}
