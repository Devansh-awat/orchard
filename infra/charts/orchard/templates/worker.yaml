{{- if and .Values.server.enabled .Values.server.workers.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server-worker") | nindent 4 }}
spec:
  {{- if not .Values.server.workers.autoscaling.enabled }}
  replicas: {{ .Values.server.workers.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: server-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "orchard.labels" (dict "root" . "name" "server-worker") | nindent 8 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftAnnotations" . }}{{- end }}
    spec:
      serviceAccountName: orchard-server
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftInit" . }}{{- end }}
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: server-worker
          image: {{ include "orchard.image" (list . .Values.server.image.name .Values.server.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:{{ include "orchard.serverEnv" . }}
            {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftEnv" . }}{{- end }}
          {{- with .Values.server.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /apiv1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /apiv1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.workers.resources | nindent 12 }}
          {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftMount" . }}{{- end }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftVolume" . }}{{- end }}
{{- $workerFloor := ternary (int .Values.server.workers.autoscaling.minReplicas) (int .Values.server.workers.replicas) .Values.server.workers.autoscaling.enabled }}
{{- if gt $workerFloor 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: server-worker
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server-worker") | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
