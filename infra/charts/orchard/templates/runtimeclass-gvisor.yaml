{{- if and .Values.tenantSandbox.enabled .Values.tenantSandbox.runtimeClassName }}
# gVisor RuntimeClass. Tenant-app Deployments created via the API set
# `runtimeClassName: gvisor` (gated by Values.tenantSandbox.runtimeClassName
# / TENANT_RUNTIME_CLASS env var on the server) so their pods run under
# the runsc user-space kernel instead of sharing the host kernel.
#
# Requirement: each node must have the `siderolabs/gvisor` Talos system
# extension installed (talos/talconfig.yaml). Without it, pods that
# select this RuntimeClass will fail to start with "no runtime for
# 'runsc' is configured".
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.tenantSandbox.runtimeClassName }}
  labels:
    app.kubernetes.io/managed-by: leaf
    app.kubernetes.io/component: tenant-sandbox
handler: runsc
{{- end }}
