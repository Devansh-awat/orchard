{{- with .Values.networkPolicy.enforcer }}
{{- if .enabled }}
{{- $ns := .namespace | default "orchard-netpol" }}
{{- if ne $ns "kube-system" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "orchard.labels" (dict "root" $ "name" "kube-router") | nindent 4 }}
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-router
  namespace: {{ $ns }}
  labels:
    {{- include "orchard.labels" (dict "root" $ "name" "kube-router") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: orchard-kube-router
  labels:
    {{- include "orchard.labels" (dict "root" $ "name" "kube-router") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, services, nodes]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: orchard-kube-router
  labels:
    {{- include "orchard.labels" (dict "root" $ "name" "kube-router") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: orchard-kube-router
subjects:
  - kind: ServiceAccount
    name: kube-router
    namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-router
  namespace: {{ $ns }}
  labels:
    {{- include "orchard.labels" (dict "root" $ "name" "kube-router") | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: kube-router
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kube-router
        {{- include "orchard.labels" (dict "root" $ "name" "kube-router") | nindent 8 }}
    spec:
      serviceAccountName: kube-router
      {{- with .priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      hostNetwork: true
      hostPID: true
      dnsPolicy: Default
      nodeSelector:
        kubernetes.io/os: linux
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-router
          image: {{ .image }}
          args:
            - --run-firewall=true
            - --run-router=false
            - --run-service-proxy=false
            - --run-loadbalancer=false
            - --enable-cni=false
            {{- range .extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          startupProbe:
            httpGet: { path: /healthz, port: 20244 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 20244 }
            periodSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            - { name: lib-modules, mountPath: /lib/modules, readOnly: true }
            - { name: xtables-lock, mountPath: /run/xtables.lock }
      volumes:
        - name: lib-modules
          hostPath: { path: /lib/modules }
        - name: xtables-lock
          hostPath: { path: /run/xtables.lock, type: FileOrCreate }
{{- end }}
{{- end }}
