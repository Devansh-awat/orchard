{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 8 }}
    spec:
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      containers:
        - name: mcp
          image: {{ include "orchard.image" (list . .Values.mcp.image.name .Values.mcp.image.tag .Values.mcp.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3100
          env:
            - { name: NODE_ENV, value: production }
            - { name: MCP_PORT, value: "3100" }
            - { name: MCP_HOST, value: "0.0.0.0" }
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-app
                  key: uri
            {{- end }}
            {{- with .Values.mcp.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.mcp.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
{{- if and .Values.mcp.ingress.enabled .Values.mcp.ingress.host }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.mcp.ingress.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.mcp.ingress.host }}`)
      services:
        - name: mcp
          port: {{ .Values.mcp.service.port }}
      {{- with .Values.mcp.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.mcp.ingress.tls.enabled }}
  tls:
    {{- with .Values.mcp.ingress.tls.secretName }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
