{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  {{- if not .Values.mcp.autoscaling.enabled }}
  replicas: {{ .Values.mcp.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 8 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftAnnotations" . }}{{- end }}
    spec:
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftInit" . }}{{- end }}
      containers:
        - name: mcp
          image: {{ include "orchard.image" (list . .Values.mcp.image.name .Values.mcp.image.tag .Values.mcp.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3100
          env:
            - { name: NODE_ENV, value: production }
            - { name: MCP_PORT, value: "3100" }
            - { name: MCP_HOST, value: "0.0.0.0" }
            {{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.name }}-app
                  key: uri
            {{- end }}
            {{- /*
              Derived from what the operator already told the chart, and only
              when they have not set it themselves. Every one of these is
              load-bearing: MCP_BASE_URL is the issuer and resource identifier
              in the OAuth metadata, FRONTEND_URL is where a client is sent to
              consent, and ORCHARD_API_URL is the API the tools call. Left to
              their defaults they point at localhost, which fails only once a
              client tries to authorise.

              `envFrom` disables all three. A container `env` entry outranks
              every `envFrom` source, so injecting one here would silently
              shadow a value held in a Secret rather than defer to it, which is
              how a chart-managed install supplies these.
            */}}
{{- $derive := not .Values.mcp.envFrom }}
            {{- if and $derive (not (include "orchard.envHas" (dict "env" .Values.mcp.env "key" "MCP_BASE_URL"))) }}
            {{- with (include "orchard.mcpUrl" .) }}
            - { name: MCP_BASE_URL, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if and $derive (not (include "orchard.envHas" (dict "env" .Values.mcp.env "key" "FRONTEND_URL"))) }}
            {{- with (include "orchard.frontendUrl" .) }}
            - { name: FRONTEND_URL, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- if and $derive (not (include "orchard.envHas" (dict "env" .Values.mcp.env "key" "ORCHARD_API_URL"))) }}
            - name: ORCHARD_API_URL
              value: {{ printf "http://server.%s.svc.cluster.local:%v" .Values.namespace .Values.server.service.port | quote }}
            {{- end }}
            {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftEnv" . }}{{- end }}
            {{- with .Values.mcp.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.mcp.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
          {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftMount" . }}{{- end }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftVolume" . }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.mcp.service.port }}
      targetPort: http
{{- if and .Values.mcp.ingress.enabled .Values.mcp.ingress.host }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.mcp.ingress.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.mcp.ingress.host }}`)
      services:
        - name: mcp
          port: {{ .Values.mcp.service.port }}
      {{- with .Values.mcp.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.mcp.ingress.tls.enabled }}
  tls:
    {{- with include "orchard.mcpTlsSecret" . }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}

{{- /*
  Same trap as the control-plane route: a bare `tls:` block makes Traefik
  terminate with its self-signed default certificate, and an MCP client will
  not talk to that. Name an issuerRef and the chart issues the host's
  certificate itself.
*/ -}}
{{- $mcpIssuer := .Values.mcp.ingress.tls.issuerRef | default dict }}
{{- if and .Values.mcp.ingress.enabled .Values.mcp.ingress.host .Values.mcp.ingress.tls.enabled $mcpIssuer.name }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "orchard.mcpTlsSecret" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "mcp") | nindent 4 }}
spec:
  secretName: {{ include "orchard.mcpTlsSecret" . }}
  issuerRef:
    name: {{ $mcpIssuer.name }}
    kind: {{ $mcpIssuer.kind | default "ClusterIssuer" }}
  commonName: {{ .Values.mcp.ingress.host | quote }}
  dnsNames:
    - {{ .Values.mcp.ingress.host | quote }}
{{- end }}
{{- end }}
