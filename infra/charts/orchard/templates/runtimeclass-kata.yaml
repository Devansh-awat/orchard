{{- if and (or .Values.builderSandbox.enabled .Values.sandbox.enabled) .Values.builderSandbox.runtimeClassName }}
# Kata Containers RuntimeClass. The image-build Jobs (`orchard-builders`
# namespace) set `runtimeClassName: kata` when BUILDER_RUNTIME_CLASS is
# configured on the server, and AI sandbox pods (`orchard-sandboxes`
# namespace) use it via SANDBOX_RUNTIME_CLASS. Each pod runs inside its own
# lightweight VM, so the privileged container is privileged-in-VM, not
# privileged-on-host.
#
# Requirement: each node must have the `siderolabs/kata-containers` Talos
# system extension installed (talos/talconfig.yaml). Without it, pods that
# select this RuntimeClass fail with `no runtime for "kata" is configured`.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.builderSandbox.runtimeClassName }}
  labels:
    app.kubernetes.io/managed-by: leaf
    app.kubernetes.io/component: builder-sandbox
handler: {{ .Values.builderSandbox.handler | default "kata" }}
{{- end }}
