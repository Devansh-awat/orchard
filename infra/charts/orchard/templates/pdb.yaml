{{- /* Keep at least one pod up during voluntary disruptions (node drains,
       rollouts). Only emitted for services running >1 replica — a PDB with
       minAvailable on a single replica would block all evictions. */}}
{{- range $svc := list "server" "frontend" "mcp" }}
{{- $cfg := index $.Values $svc }}
{{- $floor := ternary (int $cfg.autoscaling.minReplicas) (int $cfg.replicas) $cfg.autoscaling.enabled }}
{{- if and $cfg.enabled (gt $floor 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $svc }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" $ "name" $svc) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $svc }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
{{- end }}
{{- end }}
