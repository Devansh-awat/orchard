{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "orchard.labels" (dict "root" . "name" "frontend") | nindent 8 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftAnnotations" . }}{{- end }}
    spec:
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftInit" . }}{{- end }}
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: frontend
          image: {{ include "orchard.image" (list . .Values.frontend.image.name .Values.frontend.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOST, value: "0.0.0.0" }
            {{- with (include "orchard.mcpUrl" .) }}
            - { name: PUBLIC_MCP_URL, value: {{ . | quote }} }
            {{- end }}
            {{- if and .Values.frontend.sourceUrl (not (include "orchard.envHas" (dict "env" .Values.frontend.env "key" "PUBLIC_SOURCE_URL"))) }}
            - { name: PUBLIC_SOURCE_URL, value: {{ .Values.frontend.sourceUrl | quote }} }
            {{- end }}
            {{- if not (include "orchard.envHas" (dict "env" .Values.frontend.env "key" "PUBLIC_APP_DOMAIN")) }}
            {{- with (include "orchard.appDomain" .) }}
            - { name: PUBLIC_APP_DOMAIN, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- with (include "orchard.baseDomain" .) }}
            {{- if not (include "orchard.envHas" (dict "env" $.Values.frontend.env "key" "PUBLIC_BASE_DOMAIN")) }}
            - { name: PUBLIC_BASE_DOMAIN, value: {{ . | quote }} }
            {{- end }}
            {{- if not (include "orchard.envHas" (dict "env" $.Values.frontend.env "key" "PUBLIC_PLATFORM_ORIGIN")) }}
            {{- with (include "orchard.frontendUrl" $) }}
            - { name: PUBLIC_PLATFORM_ORIGIN, value: {{ . | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftEnv" . }}{{- end }}
            {{- with .Values.frontend.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftMount" . }}{{- end }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftVolume" . }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
{{- end }}
