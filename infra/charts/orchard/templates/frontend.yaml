{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "frontend") | nindent 4 }}
spec:
  {{- if not .Values.frontend.autoscaling.enabled }}
  replicas: {{ .Values.frontend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "orchard.labels" (dict "root" . "name" "frontend") | nindent 8 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftAnnotations" . }}{{- end }}
    spec:
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftInit" . }}{{- end }}
      containers:
        - name: frontend
          image: {{ include "orchard.image" (list . .Values.frontend.image.name .Values.frontend.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOST, value: "0.0.0.0" }
            {{- with (include "orchard.mcpUrl" .) }}
            - { name: PUBLIC_MCP_URL, value: {{ . | quote }} }
            {{- end }}
            {{- if not (kindIs "invalid" .Values.sandbox.lockEnabled) }}
            - { name: PUBLIC_SANDBOX_ENABLED, value: {{ .Values.sandbox.lockEnabled | toString | quote }} }
            {{- end }}
            {{- with (include "orchard.appDomain" .) }}
            - { name: PUBLIC_APP_DOMAIN, value: {{ . | quote }} }
            {{- end }}
            {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftEnv" . }}{{- end }}
            {{- with .Values.frontend.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftMount" . }}{{- end }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftVolume" . }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
{{- end }}
