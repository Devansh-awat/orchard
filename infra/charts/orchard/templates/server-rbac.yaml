{{- if .Values.server.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchard-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
---
# Orchard's control plane is a tenant-workload orchestrator: it creates and
# reconciles Deployments, Services, Ingresses, PVCs, NetworkPolicies and CNPG
# Clusters inside namespaces it provisions at runtime. Those namespaces don't
# exist at install time, so these write grants can't be namespaced Roles and
# have to be cluster-scoped.
#
# Read/write on secrets and configmaps is deliberately NOT granted cluster-wide.
# Those stay bound per-namespace: the builders namespace and the cert-manager
# source namespace (both in builders.yaml), the sandbox namespace
# (sandboxes.yaml), and per-tenant namespaces bootstrapped by the server at
# namespace-create time.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
rules:
  # Tenant namespace lifecycle. `patch` retags namespaces when a project moves
  # between orgs; `delete` reaps them when a project or environment is deleted.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Web terminal, plus the CNPG and sandbox maintenance shells.
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward", "pods/attach"]
    verbs: ["get", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Per-app PodDisruptionBudgets: written by the server, watched by the
  # workloads mirror shard.
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "limitranges", "resourcequotas"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The node informer mirrors labels/taints/capacity into the `nodes` table;
  # the nodes admin UI cordons and labels through patch.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Volume fill for every database comes from the kubelet stats summary, which
  # keeps reporting while postgres is down on a full disk and needs no exec.
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "delete"]
  # cert-manager Certificates are read, never written: without this a failed
  # issuance is indistinguishable from a working one, which is how a host ends
  # up serving no certificate with nothing in the UI to say so. Granted
  # unconditionally because it costs nothing on a cluster with no cert-manager,
  # where the reads simply 404.
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch"]
{{- if .Values.cilium.enabled }}
  # Per-tenant L3/L7 policy and the basic-auth proxy in front of protected
  # deployments are Cilium CRDs. Only needed when Cilium is the CNI.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies", "ciliumenvoyconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
  # Each tenant namespace gets a RoleBinding to the fixed tenant-secrets
  # ClusterRole below (K8sNamespaceService.bootstrapTenantSecretsRbac). `bind`
  # is limited to that one ClusterRole by name, so the control plane can hand
  # itself secrets access inside a namespace it provisions and nothing wider.
  # Narrower per-deployment Roles (Tailscale state) are created after that
  # binding exists, so every permission they grant is already held.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["{{ .Release.Name }}-tenant-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-tenant-secrets
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-server
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: orchard-server
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-server-leases
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-server-leases
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: orchard-server
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ .Release.Name }}-server-leases
  apiGroup: rbac.authorization.k8s.io
{{- end }}
