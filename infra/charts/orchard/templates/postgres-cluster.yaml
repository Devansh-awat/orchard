{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  {{- with .Values.postgres.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  postgresql:
    parameters:
      max_slot_wal_keep_size: {{ .Values.postgres.walSlotKeepSize | quote }}
      {{- if .Values.datadog.enabled }}
      # Datadog Database Monitoring prerequisites. CNPG manages pg_stat_statements
      # as a "managed extension": setting its parameters below makes the operator
      # add it to shared_preload_libraries (rolling restart) and CREATE EXTENSION
      # in the app database.
      pg_stat_statements.track: all
      pg_stat_statements.max: "10000"
      track_activity_query_size: "4096"
      track_io_timing: "on"
      {{- end }}
  {{- with .Values.postgres.backup }}
  {{- if .enabled }}
  backup:
    retentionPolicy: {{ .retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ required "postgres.backup.destinationPath is required when backups are enabled" .destinationPath | quote }}
      {{- with .endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .secretName }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .secretName }}
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: {{ .walMaxParallel }}
      data:
        compression: gzip
  {{- end }}
  {{- end }}
  {{- if or .Values.datadog.enabled .Values.r2Proxy.enabled }}
  managed:
    roles:
      {{- if .Values.datadog.enabled }}
      # Read-only monitoring user the Datadog agent connects as. Password
      # lives in the orchard-db-datadog secret (kubeops, SOPS-encrypted).
      - name: datadog
        ensure: present
        login: true
        inherit: true
        inRoles: [pg_monitor]
        passwordSecret:
          name: orchard-db-datadog
      {{- end }}
      {{- if .Values.r2Proxy.enabled }}
      # The backup proxy only ever runs one SELECT. The server grants it read
      # on the three tables it needs at boot; it never holds the app owner.
      - name: orchard_r2_proxy
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: orchard-r2-proxy-db
      {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    storageClass: {{ .Values.postgres.storage.storageClass }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.postgres.name }}-schedule
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ .Values.postgres.name }}
{{- end }}
{{- end }}
{{- if and .Values.postgres.enabled .Values.r2Proxy.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: orchard-r2-proxy-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: orchard_r2_proxy
  password: {{ include "orchard.r2ProxyDbPassword" . | quote }}
{{- end }}
