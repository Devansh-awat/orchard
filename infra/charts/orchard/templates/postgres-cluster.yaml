{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  {{- with .Values.postgres.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  postgresql:
    parameters:
      max_slot_wal_keep_size: {{ .Values.postgres.walSlotKeepSize | quote }}
      {{- if .Values.datadog.enabled }}
      # Datadog Database Monitoring prerequisites. CNPG manages pg_stat_statements
      # as a "managed extension": setting its parameters below makes the operator
      # add it to shared_preload_libraries (rolling restart) and CREATE EXTENSION
      # in the app database.
      pg_stat_statements.track: all
      pg_stat_statements.max: "10000"
      track_activity_query_size: "4096"
      track_io_timing: "on"
      {{- end }}
  {{- with .Values.postgres.backup }}
  {{- if and .enabled (eq .method "plugin") }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $.Values.postgres.name }}-store
        serverName: {{ $.Values.postgres.name }}
  {{- else if .enabled }}
  backup:
    retentionPolicy: {{ .retentionPolicy | quote }}
    barmanObjectStore:
      destinationPath: {{ required "postgres.backup.destinationPath is required when backups are enabled" .destinationPath | quote }}
      {{- with .endpointURL }}
      endpointURL: {{ . | quote }}
      {{- end }}
      s3Credentials:
        accessKeyId:
          name: {{ .secretName }}
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ .secretName }}
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
        maxParallel: {{ .walMaxParallel }}
      data:
        compression: gzip
  {{- end }}
  {{- end }}
  {{- if or .Values.datadog.enabled (include "orchard.r2ProxyActive" .) }}
  managed:
    roles:
      {{- if .Values.datadog.enabled }}
      # Read-only monitoring user the Datadog agent connects as. Password
      # lives in the orchard-db-datadog secret (kubeops, SOPS-encrypted).
      - name: datadog
        ensure: present
        login: true
        inherit: true
        inRoles: [pg_monitor]
        passwordSecret:
          name: orchard-db-datadog
      {{- end }}
      {{- if include "orchard.r2ProxyActive" . }}
      # The backup proxy only ever runs one SELECT. The server grants it read
      # on the three tables it needs at boot; it never holds the app owner.
      - name: orchard_r2_proxy
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: orchard-r2-proxy-db
      {{- end }}
  {{- end }}
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with include "orchard.storageClass" (dict "value" .Values.postgres.storage.storageClass "apiVersion" "postgresql.cnpg.io/v1" "kind" "Cluster" "namespace" .Values.namespace "name" .Values.postgres.name) }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
{{- if .Values.postgres.backup.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ .Values.postgres.name }}-schedule
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  cluster:
    name: {{ .Values.postgres.name }}
  {{- if eq .Values.postgres.backup.method "plugin" }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  {{- end }}
{{- if eq .Values.postgres.backup.method "plugin" }}
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ .Values.postgres.name }}-store
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  retentionPolicy: {{ .Values.postgres.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: {{ required "postgres.backup.destinationPath is required when backups are enabled" .Values.postgres.backup.destinationPath | quote }}
    {{- with .Values.postgres.backup.endpointURL }}
    endpointURL: {{ . | quote }}
    {{- end }}
    s3Credentials:
      accessKeyId:
        name: {{ .Values.postgres.backup.secretName }}
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: {{ .Values.postgres.backup.secretName }}
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: {{ .Values.postgres.backup.walMaxParallel }}
    data:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 512Mi }
    env:
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
{{- end }}
{{- end }}
{{- end }}
{{- if and .Values.postgres.enabled (include "orchard.r2ProxyActive" .) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: orchard-r2-proxy-db
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "postgres") | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: orchard_r2_proxy
  password: {{ include "orchard.r2ProxyDbPassword" . | quote }}
{{- end }}
