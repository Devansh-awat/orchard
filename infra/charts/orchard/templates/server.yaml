{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 8 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftAnnotations" . }}{{- end }}
    spec:
      serviceAccountName: orchard-server
      terminationGracePeriodSeconds: 45
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftInit" . }}{{- end }}
      {{- include "orchard.priorityClass" $ | nindent 6 }}
      containers:
        - name: server
          image: {{ include "orchard.image" (list . .Values.server.image.name .Values.server.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:{{ include "orchard.serverEnv" . }}
            {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftEnv" . }}{{- end }}
            {{- if .Values.server.workers.enabled }}
            - { name: BUILD_WORKER_DISABLED, value: "true" }
            - { name: APPLY_WORKER_DISABLED, value: "true" }
            {{- end }}
          {{- with .Values.server.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          readinessProbe:
            httpGet: { path: /apiv1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /apiv1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftMount" . }}{{- end }}
      {{- if include "orchard.graftsOn" . }}{{- include "orchard.graftVolume" . }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "server") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
{{- end }}
