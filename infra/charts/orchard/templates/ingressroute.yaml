{{- if .Values.ingress.enabled }}
{{- /*
  Traefik v3 dropped the multi-argument form: Host(`a`, `b`) is a v2 rule and
  v3 refuses to parse it, which drops the whole router rather than falling back
  to the first host, so every name 404s including the one that worked before.
  One matcher per host, OR'd, and the parentheses are load-bearing: && binds
  tighter than ||, so without them the /apiv1 rule matches the first host on
  every path and the dashboard disappears behind the API.
*/}}
{{- $matchers := list }}
{{- range $host := concat (list .Values.ingress.host) (default (list) .Values.ingress.extraHosts) }}
{{- $matchers = append $matchers (printf "Host(`%s`)" $host) }}
{{- end }}
{{- $hostMatch := first $matchers }}
{{- if gt (len $matchers) 1 }}
{{- $hostMatch = printf "(%s)" (join " || " $matchers) }}
{{- end }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: orchard
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "ingress") | nindent 4 }}
spec:
  entryPoints:
    {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: {{ $hostMatch }} && PathPrefix(`/apiv1`)
      services:
        - name: server
          port: {{ .Values.server.service.port }}
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - kind: Rule
      match: {{ $hostMatch }}
      services:
        - name: frontend
          port: {{ .Values.frontend.service.port }}
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    {{- with include "orchard.ingressTlsSecret" . }}
    secretName: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}

{{- /*
  A bare `tls:` with no secretName tells Traefik to terminate with its default
  certificate, which is the self-signed TRAEFIK DEFAULT CERT. Set
  ingress.tls.issuerRef and the chart issues the control-plane certificate
  itself rather than expecting secretName to be filled in out of band.
*/ -}}
{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled }}
{{- $issuer := .Values.ingress.tls.issuerRef | default dict }}
{{- if $issuer.name }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "orchard.ingressTlsSecret" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "orchard.labels" (dict "root" . "name" "ingress") | nindent 4 }}
spec:
  secretName: {{ include "orchard.ingressTlsSecret" . }}
  issuerRef:
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind | default "ClusterIssuer" }}
  commonName: {{ .Values.ingress.host | quote }}
  dnsNames:
    - {{ .Values.ingress.host | quote }}
{{- end }}
{{- end }}
