# Bindings for a live test: every policy applied with Deny to namespaces labelled orchard.my/policy-sandbox=true only.
# The namespace policy has no namespace selector (it watches Namespace objects), so it is Warn-only here.
# Needs the parameter ConfigMap from fixtures/params.yaml in the orchard namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: sandbox-orchard-tenant-pods }
spec:
  policyName: orchard-tenant-pods
  validationActions: ["Deny"]
  matchResources: { namespaceSelector: { matchLabels: { orchard.my/policy-sandbox: "true" } } }
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: { name: sandbox-orchard-tenant-pods-hardening }
spec:
  policyName: orchard-tenant-pods-hardening
  paramRef: { name: orchard-tenant-policy, namespace: orchard, parameterNotFoundAction: Allow }
  validationActions: ["Deny"]
  matchResources: { namespaceSelector: { matchLabels: { orchard.my/policy-sandbox: "true" } } }
---
