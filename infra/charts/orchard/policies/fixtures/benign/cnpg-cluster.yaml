# user: system:serviceaccount:orchard:orchard-server
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: db
  namespace: orchard-policy-test
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/component: postgres
    app.kubernetes.io/managed-by: orchard
  annotations:
    orchard.my/applied-shared-buffers: 64MB
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: app
      owner: u_app
      secret:
        name: db-app
      import:
        type: microservice
        databases:
          - x
        source:
          externalCluster: import-source
        postImportApplicationSQL:
          - ANALYZE
  postgresql:
    parameters:
      max_connections: '200'
      shared_buffers: 64MB
      max_slot_wal_keep_size: 2GB
      work_mem: 8MB
    shared_preload_libraries:
      - pg_stat_statements
  enableSuperuserAccess: false
  externalClusters:
    - name: import-source
      connectionParameters:
        host: src.example.com
        port: '5432'
        user: u
        dbname: x
        sslmode: require
      password:
        name: db-import-source
        key: password
