# user: system:serviceaccount:orchard:orchard-server
apiVersion: v1
kind: Service
metadata:
  name: app-nodeport
  labels:
    app.kubernetes.io/name: app-nodeport
    app.kubernetes.io/managed-by: orchard
  namespace: orchard-policy-test
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: app-nodeport
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
