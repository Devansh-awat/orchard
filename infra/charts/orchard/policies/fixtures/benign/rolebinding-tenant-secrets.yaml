# user: system:serviceaccount:orchard:orchard-server
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchard-server-tenant-secrets
  namespace: orchard-policy-test
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/managed-by: leaf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: orchard-server-tenant-secrets
subjects:
  - kind: ServiceAccount
    name: orchard-server
    namespace: orchard
