# user: system:serviceaccount:orchard:orchard-server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-database-platform
  namespace: orchard-policy-test
  labels:
    orchard.my/managed: 'true'
    app.kubernetes.io/managed-by: orchard
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgresql
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudnative-pg
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orchard
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - ipBlock:
            cidr: 10.0.0.1/32
      ports:
        - protocol: TCP
          port: 6443
