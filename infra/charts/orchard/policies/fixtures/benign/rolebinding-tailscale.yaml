# user: system:serviceaccount:orchard:orchard-server
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ts--proxy--app
  labels:
    app.kubernetes.io/managed-by: orchard
    orchard.my/tailscale: 'true'
    orchard.my/target-deployment: app
  namespace: orchard-policy-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ts--proxy--app
subjects:
  - kind: ServiceAccount
    name: ts--proxy--app
    namespace: orchard-policy-test
