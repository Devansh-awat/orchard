# user: system:serviceaccount:orchard:orchard-server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-project-databases
  namespace: orchard-policy-test
  labels:
    orchard.my/managed: 'true'
    app.kubernetes.io/managed-by: orchard
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orchard-policy-test
      ports:
        - protocol: TCP
          port: 5432
