apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: orchard-metrics
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  ports:
    - { name: http-metrics, port: 8080, targetPort: 8080 }
    - { name: telemetry,    port: 8081, targetPort: 8081 }
  selector:
    app: kube-state-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: orchard-metrics
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - "--port=8080"
            - "--telemetry-port=8081"
            - "--resources=daemonsets,deployments,jobs,pods,replicasets,statefulsets,nodes,namespaces,services,horizontalpodautoscalers,resourcequotas,persistentvolumeclaims,cronjobs,limitranges,replicationcontrollers,storageclasses,endpoints,ingresses,networkpolicies"
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: telemetry,    containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /, port: http-metrics }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: telemetry }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
