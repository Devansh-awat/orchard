<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Orchard</title>
		<meta name="theme-color" content="#fffff8" />
		<meta name="robots" content="noindex" />
		<link rel="icon" href="/favicon.ico" />
		<style>
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				background: #fffff8;
				min-height: 100svh;
				overflow: hidden;
			}
			.scene {
				position: fixed;
				left: 50%;
				bottom: 14svh;
				width: min(56vw, 280px, 34svh);
				transform: translateX(-50%) scale(var(--g, 1));
				transform-origin: 49% 28%;
				transition: opacity 2.4s ease;
			}
			.scene.gone {
				opacity: 0;
			}
			.scene img {
				display: block;
				width: 100%;
				height: auto;
				user-select: none;
				-webkit-user-drag: none;
			}
			.ground {
				margin-top: -2.7%;
			}
			.party {
				position: fixed;
				inset: 0;
				overflow: hidden;
				opacity: 0;
				pointer-events: none;
				background: #1d2230;
			}
			.party.on {
				opacity: 1;
			}
			.party.reveal {
				animation: reveal 4.2s linear;
			}
			@keyframes reveal {
				0% {
					opacity: 0;
				}
				93% {
					opacity: 0.06;
					animation-timing-function: cubic-bezier(0.7, 0, 1, 0.5);
				}
				100% {
					opacity: 1;
				}
			}
			.backdrop {
				position: absolute;
				inset: -12%;
				background: url('https://cdn.lfdl.ink/QtCjwlDia1mxLRbc.png') center / cover;
				filter: blur(32px) brightness(0.7) saturate(0.9);
			}
			.leo {
				position: absolute;
				left: 50%;
				bottom: -8svh;
				height: 106svh;
				aspect-ratio: 387 / 516;
				max-width: 112vw;
				transform: translateX(-50%);
			}
			.leo img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				transform-origin: 50% 100%;
				mask-image: radial-gradient(ellipse 62% 58% at 50% 50%, #000 70%, transparent 100%);
				user-select: none;
				-webkit-user-drag: none;
			}
			.snow {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div class="scene">
			<img class="flower" src="/flower.png" alt="a flower" width="1000" height="1042" />
			<img class="ground" src="/ground.png" alt="" width="500" height="108" />
		</div>
		<div class="party" aria-hidden="true">
			<div class="backdrop"></div>
			<div class="leo">
				<img src="https://cdn.lfdl.ink/QtCjwlDia1mxLRbc.png" alt="" width="387" height="516" />
			</div>
			<canvas class="snow"></canvas>
		</div>
		<script>
			const scene = document.querySelector('.scene');
			const party = document.querySelector('.party');
			const leoImg = document.querySelector('.leo img');
			const canvas = document.querySelector('.snow');
			const song = new Audio('https://cdn.lfdl.ink/GQwPS6OqgHjY03xm.mp3');
			song.loop = true;
			song.preload = 'auto';

			const KEY = 'orchard:n';
			const GROW_STEPS = 8;
			const GROW = 1.22;
			const LEOPARD_AT = GROW_STEPS + 1;
			const BEAT = 60 / 128;

			let n = Math.max(0, Math.floor(Number(localStorage.getItem(KEY)) || 0));
			let running = false;
			let started = 0;
			let flakes = [];

			function render() {
				scene.style.setProperty('--g', GROW ** Math.min(n, GROW_STEPS));
			}

			function unlockOnGesture() {
				const go = () => {
					removeEventListener('pointerdown', go);
					removeEventListener('keydown', go);
					playSong();
				};
				addEventListener('pointerdown', go);
				addEventListener('keydown', go);
			}

			function playSong() {
				if (!song.paused) return;
				song.volume = 0.8;
				song.play().catch(unlockOnGesture);
			}

			function resize() {
				const dpr = Math.min(devicePixelRatio || 1, 2);
				canvas.width = innerWidth * dpr;
				canvas.height = innerHeight * dpr;
				const count = Math.round((innerWidth * innerHeight) / 9000);
				flakes = Array.from({ length: count }, () => ({
					x: Math.random(),
					y: Math.random(),
					r: 0.6 + Math.random() * 2.2,
					v: 0.03 + Math.random() * 0.07,
					d: Math.random() * Math.PI * 2,
				}));
			}

			function frame(t) {
				if (!running) return;
				const time = song.paused ? (t - started) / 1000 : song.currentTime;
				const phase = (time / BEAT) % 1;
				const lift = Math.sin(Math.PI * phase);
				const land = Math.max(0, 1 - phase / 0.12) + Math.max(0, (phase - 0.9) / 0.1);
				leoImg.style.transform = `translateY(${-lift * 7}%) scale(${1 + land * 0.04}, ${1 - land * 0.06})`;

				const ctx = canvas.getContext('2d');
				const w = canvas.width;
				const h = canvas.height;
				const dpr = w / innerWidth;
				ctx.clearRect(0, 0, w, h);
				ctx.fillStyle = '#ffffffcc';
				for (const f of flakes) {
					f.y += f.v / 60;
					if (f.y > 1.02) {
						f.y = -0.02;
						f.x = Math.random();
					}
					const fx = (f.x + Math.sin(t / 1400 + f.d) * 0.01) * w;
					ctx.beginPath();
					ctx.arc(fx, f.y * h, f.r * dpr, 0, Math.PI * 2);
					ctx.fill();
				}
				requestAnimationFrame(frame);
			}

			function showLeopard(animate) {
				scene.classList.add('gone');
				if (!running) {
					running = true;
					started = performance.now();
					resize();
					addEventListener('resize', resize);
					requestAnimationFrame(frame);
				}
				if (animate) {
					party.classList.add('reveal');
					party.addEventListener(
						'animationend',
						() => {
							party.classList.add('on');
							playSong();
						},
						{ once: true },
					);
				} else {
					party.classList.add('on');
					playSong();
				}
			}

			function leave() {
				n += 1;
				localStorage.setItem(KEY, n);
				render();
			}

			function back() {
				if (n === LEOPARD_AT) showLeopard(true);
			}

			document.addEventListener('visibilitychange', () => {
				if (document.hidden) {
					document.title = 'come back.';
					leave();
				} else {
					document.title = 'Orchard';
					back();
				}
			});

			render();
			if (n >= LEOPARD_AT) showLeopard(false);
		</script>
	</body>
</html>
