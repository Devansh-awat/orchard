<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		%orchard.grafts%
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon/favicon.ico" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon/favicon-16x16.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicon/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<title>Orchard Dashboard</title>
		<link
			rel="preload"
			href="%orchard.font.sans%"
			as="font"
			type="font/woff2"
			crossorigin="anonymous"
		/>
		<script>
			(function () {
				try {
					var mode = localStorage.getItem('theme');
					var dark =
						mode === 'dark' ||
						(mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
					var boot = JSON.parse(localStorage.getItem('orchard-theme-boot') || 'null');
					var css = boot && (dark ? boot.dark : boot.light);
					if (css) {
						var style = document.createElement('style');
						style.id = 'theme-boot';
						style.textContent = ':root{' + css + '}';
						document.head.appendChild(style);
					}
				} catch (e) {
					// no stored theme yet
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body class="h-full" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
