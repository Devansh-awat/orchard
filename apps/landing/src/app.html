<!doctype html>
<html lang="en" class="antialiased">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon/favicon.ico" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon/favicon-16x16.png"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/favicon/apple-touch-icon.png"
		/>
		<link rel="manifest" href="%sveltekit.assets%/favicon/site.webmanifest" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/Plus_Jakarta_Sans/PlusJakartaSans-VariableFont_wght.ttf"
			as="font"
			type="font/ttf"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function () {
				try {
					if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
						document.documentElement.dataset.intro = 'cascade';
					}
				} catch (e) {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
