apiVersion: leaf/v1
kind: Template
metadata:
  name: nodejs-postgres
  displayName: Node.js + PostgreSQL
  description: A Node.js application backed by PostgreSQL. Provides DATABASE_URL automatically.
  icon: nodejs
  version: "1.0.0"
  category: backend
  tags: ["nodejs", "javascript", "postgres", "api"]

parameters:
  - name: appName
    displayName: App Name
    description: Name prefix for all resources
    type: string
    default: my-app
    required: true
    validation:
      pattern: "^[a-z][a-z0-9-]{1,58}[a-z0-9]$"
      message: Must be lowercase alphanumeric with hyphens, 3-60 chars

  - name: image
    displayName: Docker Image
    description: Your Node.js application Docker image
    type: string
    required: true
    placeholder: "my-registry/my-app:latest"

  - name: port
    displayName: App Port
    description: Port your application listens on
    type: number
    default: 3000
    validation:
      min: 1
      max: 65535

  - name: replicas
    displayName: Replicas
    type: number
    default: 1
    validation:
      min: 1
      max: 10

  - name: domain
    displayName: Domain
    description: Public domain for the application
    type: string
    required: true
    placeholder: "api.example.com"

  - name: enableTls
    displayName: Enable HTTPS
    type: boolean
    default: true

resources:
  - name: db
    type: database
    config:
      name: "{{ params.appName }}-db"

  - name: app
    type: deployment
    config:
      name: "{{ params.appName }}"
      image: "{{ params.image }}"
      replicas: "{{ params.replicas }}"
      ports:
        - name: http
          containerPort: "{{ params.port }}"
          servicePort: "{{ params.port }}"
          protocol: TCP
      env:
        - key: DATABASE_URL
          value: "{{ resources.db.connectionString }}"
        - key: PORT
          value: "{{ params.port }}"
        - key: NODE_ENV
          value: production

  - name: ingress
    type: ingress
    config:
      host: "{{ params.domain }}"
      tlsEnabled: "{{ params.enableTls }}"
      routes:
        - path: /
          serviceName: "{{ resources.app.serviceName }}"
          servicePort: "{{ params.port }}"
