# goreleaser v2 config for the Orchard CLI.
#
# Releases are cut by release-please with monorepo component tags (cli/vX.Y.Z).
# goreleaser's native monorepo support (monorepo.tag_prefix + monorepo.dir) is
# a GoReleaser Pro feature and the OSS binary rejects it, so the release
# workflow compensates: it checks out the cli/vX.Y.Z tag, creates a local
# plain vX.Y.Z tag for goreleaser to version from, runs this config with
# publishing disabled, and uploads dist/ assets to the existing GitHub
# release via gh (see .github/workflows/release.yml, job cli-binaries).
version: 2

project_name: orchard

builds:
  - main: .
    binary: orchard
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/hackclub/orchard/cli/cmd.Version={{ .Version }}

archives:
  - name_template: "orchard_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  disable: true

# The source repo is private, so its release assets 404 for anonymous
# downloads (brew, install.sh). Binaries publish to the public releases-only
# repo instead, under plain vX.Y.Z tags; release-please still owns the
# cli/vX.Y.Z release on the source repo, which the workflow also feeds via
# gh release upload for internal provenance.
release:
  github:
    owner: LeafdTK
    name: orchard-releases

# The quarantine hook is the goreleaser-recommended replacement for signing:
# binaries are not notarized, so Gatekeeper would block them otherwise.
# Token is orchard-cli, not orchard: homebrew core already ships a cask named
# orchard (a containers GUI), and the unqualified name resolves to that one.
# The installed binary is still `orchard`.
homebrew_casks:
  - name: orchard-cli
    # Without this goreleaser derives the linked binary from the cask NAME
    # (orchard-cli), but the archive ships a binary named orchard.
    binaries:
      - orchard
    repository:
      owner: LeafdTK
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    url:
      template: "https://github.com/LeafdTK/orchard-releases/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    homepage: https://github.com/hackclub/orchard
    description: Orchard platform CLI
    commit_author:
      name: leafdbot[bot]
      email: leafdbot[bot]@users.noreply.github.com
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/orchard"]
          end
