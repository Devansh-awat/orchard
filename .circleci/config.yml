version: 2.1
setup: true

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  decide:
    docker:
      - image: cimg/node:22.13.0
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Decide what to continue with
          command: |
            set -euo pipefail
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              # Run release-please here so we know what it bumped BEFORE choosing
              # which jobs to schedule — only bumped components get a workflow.
              git config user.name "leafdbot[bot]"
              git config user.email "192038741+leafdbot[bot]@users.noreply.github.com"
              TOKEN="$(bash .circleci/gh-app-token.sh)"
              GITHUB_TOKEN="$TOKEN" bash tools/release/run-release.sh

              VB64="$(base64 < versions.json | tr -d '\n')"
              F="$(jq -r '.released_frontend // false' versions.json)"
              S="$(jq -r '.released_server // false' versions.json)"
              M="$(jq -r '.released_mcp // false' versions.json)"
              R="$(jq -r '."released_r2-proxy" // false' versions.json)"
              ANY="$(jq -r '.released // false' versions.json)"
              jq -n --arg vb "$VB64" --argjson f "$F" --argjson s "$S" \
                    --argjson m "$M" --argjson r "$R" --argjson a "$ANY" \
                '{versions_b64:$vb, released_frontend:$f, released_server:$s, released_mcp:$m, released_r2_proxy:$r, released_any:$a}' \
                > /tmp/params.json
              cp .circleci/release.yml /tmp/continue.yml
            else
              bash .circleci/changed.sh /tmp/params.json
              cp .circleci/continue.yml /tmp/continue.yml
            fi
            cat /tmp/params.json
      - continuation/continue:
          configuration_path: /tmp/continue.yml
          parameters: /tmp/params.json

workflows:
  setup:
    jobs:
      - decide
