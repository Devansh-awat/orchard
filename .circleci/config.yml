version: 2.1
setup: true

orbs:
  continuation: circleci/continuation@1.0.0

jobs:
  decide:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Detect changed components
          command: bash .circleci/changed.sh /tmp/pipeline-params.json
      - continuation/continue:
          configuration_path: .circleci/continue.yml
          parameters: /tmp/pipeline-params.json

workflows:
  setup:
    jobs:
      - decide
