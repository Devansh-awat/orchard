{{- if .Values.r2Proxy.enabled }}
# r2-proxy — S3 V4 re-signing gateway sitting between CNPG/barman pods and
# the real R2 endpoint. Tenant clusters hold per-cluster "fake" credentials
# that only work via this proxy and only against their own prefix.
# The real R2 key lives in `r2-proxy-upstream` here and never leaves this ns.
#
# Bindings are read directly from orchard's Postgres `databases` table — no
# ConfigMap to drift out of sync with the source of truth.
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/managed-by: orchard
    orchard.io/component: r2-proxy
---
# Upstream R2 credentials — the only place the real R2 key exists in-cluster.
# Set via values, or replace with an externally-managed Secret (External Secrets,
# SOPS, Vault, etc.) and point the Deployment at it instead.
apiVersion: v1
kind: Secret
metadata:
  name: r2-proxy-upstream
  namespace: {{ .Values.r2Proxy.namespace }}
type: Opaque
stringData:
  R2_ENDPOINT: {{ .Values.r2Proxy.upstream.endpoint | quote }}
  R2_REGION: {{ .Values.r2Proxy.upstream.region | quote }}
  R2_ACCESS_KEY: {{ .Values.r2Proxy.upstream.accessKey | quote }}
  R2_SECRET_KEY: {{ .Values.r2Proxy.upstream.secretKey | quote }}
---
# Database URL for binding lookups. By default cloned from the existing CNPG
# `<cluster>-app` Secret at helm-template time. Override via values if you
# want to point the proxy at a read-only role (recommended in prod).
apiVersion: v1
kind: Secret
metadata:
  name: r2-proxy-db
  namespace: {{ .Values.r2Proxy.namespace }}
type: Opaque
stringData:
{{- if .Values.r2Proxy.databaseUrl }}
  DATABASE_URL: {{ .Values.r2Proxy.databaseUrl | quote }}
{{- else }}
{{- $dbSecretName := printf "%s-app" .Values.postgres.name }}
{{- $dbSecret := (lookup "v1" "Secret" .Values.namespace $dbSecretName) }}
{{- if and $dbSecret $dbSecret.data $dbSecret.data.uri }}
  DATABASE_URL: {{ $dbSecret.data.uri | b64dec | quote }}
{{- else }}
  # Set r2Proxy.databaseUrl in values or ensure {{ $dbSecretName }} exists
  # in the {{ .Values.namespace }} namespace before installing this chart.
  DATABASE_URL: ""
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: r2-proxy
  namespace: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: orchard
spec:
  replicas: {{ .Values.r2Proxy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: r2-proxy
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: r2-proxy
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- include "orchard.pullSecrets" . | nindent 6 }}
      containers:
        - name: r2-proxy
          image: {{ include "orchard.image" (list . .Values.r2Proxy.image.name .Values.r2Proxy.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9000
          env:
            - { name: PROXY_LISTEN, value: ":9000" }
          envFrom:
            - secretRef:
                name: r2-proxy-upstream
            - secretRef:
                name: r2-proxy-db
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.r2Proxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: r2-proxy
  namespace: {{ .Values.r2Proxy.namespace }}
  labels:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: r2-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 9000
      targetPort: http
{{- if .Values.r2Proxy.networkPolicy.enabled }}
---
# Default-deny + tightly-scoped allow rules for the proxy namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: r2-proxy-ingress
  namespace: {{ .Values.r2Proxy.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: r2-proxy
  policyTypes: [Ingress]
  ingress:
    # Allow ingress from anywhere on the proxy port. CNPG clusters live in
    # tenant namespaces; restricting source namespaces here would require
    # labelling every tenant namespace, which the server doesn't do today.
    # Defense-in-depth: per-key prefix policy at the app layer is the real
    # security boundary; this rule is just shape.
    - ports:
        - port: 9000
          protocol: TCP
{{- end }}
{{- end }}
